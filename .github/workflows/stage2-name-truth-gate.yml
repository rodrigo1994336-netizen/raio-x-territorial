name: Stage 2 Name Truth Gate

on:
  push:
    branches: [ v44-step2-finalize, main ]
    paths:
      - property_identity_runtime.py
      - property_names_viewport_v30.py
      - portal_property_names_v30.py
      - cafir_name_search_v44.py
      - portal_cafir_inverse_v44.py
      - portal_advanced_name_v40.py
      - data/cafir/name_shards/MG/**
      - .github/workflows/stage2-name-truth-gate.yml
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  truth-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed Python modules
        run: |
          python -m py_compile property_identity_runtime.py property_names_viewport_v30.py portal_property_names_v30.py cafir_name_search_v44.py portal_cafir_inverse_v44.py portal_advanced_name_v40.py
      - name: Enforce name truth contract
        run: |
          python - <<'PY'
          from pathlib import Path

          identity=Path('property_identity_runtime.py').read_text()
          viewport=Path('property_names_viewport_v30.py').read_text()
          ui=Path('portal_property_names_v30.py').read_text()
          inverse=Path('portal_cafir_inverse_v44.py').read_text()
          inverse_runtime=Path('cafir_name_search_v44.py').read_text()
          legacy=Path('portal_advanced_name_v40.py').read_text()

          # Live OSM and raw SIGEF are references, never property identities.
          assert "'reference_kind':'OSM_LIVE'" in identity
          assert "'reference_kind':'SIGEF_CADASTRAL'" in identity
          assert "'panel_name_eligible':False" in identity
          assert "'method':'osm_named_farm_point_inside_car'" not in identity
          assert "'method':'strong_sigef_overlap'" not in identity
          assert "'chosen':None" in identity
          assert 'nunca são promovidas automaticamente a denominação do CAR' in identity

          # Viewport items carry machine-readable semantics; no source-string guessing.
          assert "'display_kind':'VALIDATED_PROPERTY_NAME'" in viewport
          assert "'display_kind':'REFERENCE'" in viewport
          assert "'validation_status':'VALIDATED'" in viewport
          assert "'panel_name_eligible':True" in viewport
          assert "'panel_name_eligible':False" in viewport
          assert "'reference_kind':'OSM_LIVE'" in viewport
          assert "'reference_kind':'SIGEF_CADASTRAL'" in viewport
          assert "'map_anchor':'CAR_POLYGON'" in viewport
          assert "'car_code':car_code" in viewport
          assert 'validated_property_names_returned' in viewport
          assert 'reference_names_returned' in viewport

          # UI has two visual languages and explicit disclaimer.
          assert 'rx-name-validated' in ui
          assert 'rx-name-reference' in ui
          assert 'referência(s) do OpenStreetMap — não confirmada(s) para o imóvel' in ui
          assert 'referência(s) SIGEF/INCRA — não vinculada(s) ao CAR' in ui
          assert "validated?openValidatedProperty(x):openReference(x)" in ui

          # Reference click cannot mutate or open the property panel.
          reference_body=ui.split('function openReference(x){',1)[1].split('function render(items,z){',1)[0]
          assert 'showProperty' not in reference_body
          assert 'd.property.name' not in reference_body
          assert '/v1/live/resolve' not in reference_body

          # Validated path requires exact CAR and identity cross-check before panel mutation.
          assert 'resolved!==expected' in ui
          assert "id?.validation_status==='VALIDATED'" in ui
          assert 'id?.panel_name_eligible===true' in ui
          assert 'identityCar===expected' in ui
          assert 'd.property.name=identityName' in ui
          assert 'd.property.name=x.name' not in ui
          assert 'Denominação validada · Origem:' in ui

          # Inverse search is CAFIR-first and never names a CAR by inference.
          assert "'type':'cafir'" in inverse_runtime
          assert "'car_code':None" in inverse_runtime
          assert "'panel_name_eligible':False" in inverse_runtime
          assert "x?.type==='cafir'" in inverse
          assert 'CAR não vinculado automaticamente' in inverse
          assert 'd.property.name=x.name' not in legacy
          assert 'REFERENCE_ONLY_CENTROID' in legacy

          print('RX_STAGE2_NAME_TRUTH_GATE=PASS')
          PY
      - name: Verify direct CAFIR inverse-search benchmark from materialized official index
        run: |
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          root=Path('data/cafir/name_shards/MG')
          meta=json.loads((root/'meta.json').read_text(encoding='utf-8'))
          assert meta['snapshot']=='D60901'
          assert meta['active_records']==1281097
          assert meta['active_named_records']==1280741
          assert meta['indexed_named_records']==1280710
          assert meta['unsearchable_normalized_names']==31
          assert meta['personal_data_fields_in_index'] is False
          found=[]
          with gzip.open(root/'L.jsonl.gz','rt',encoding='utf-8') as f:
              for line in f:
                  row=json.loads(line)
                  alias,name,municipality,area_tenth,incra,nirf=row
                  if alias=='LAGOA BONITA' and municipality=='CURVELO':
                      found.append(row)
          exact=[r for r in found if r[1].upper()=='SITIO LAGOA BONITA' and r[3]==119 and r[4]=='0000192269636' and r[5]=='72558199']
          assert exact, found[:20]
          print('RX_STAGE2_CAFIR_INVERSE=PASS','matches=',len(found),'benchmark=',exact[0])
          PY
