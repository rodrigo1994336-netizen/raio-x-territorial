name: V45 Stage 3 SICAR app inspect

on:
  push:
    branches: [ v45-stage3-car-composition ]
    paths:
      - '.github/workflows/v45-stage3-sicar-app-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Extract API base and download flows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          curl -k -L -sS --connect-timeout 12 --max-time 90 \
            'https://consulta.car.gov.br/assets/index-DEyWcQqf.js' -o probe/app.js
          python - <<'PY'
          from pathlib import Path
          text=Path('probe/app.js').read_text(encoding='utf-8',errors='ignore')
          anchors=[
            'environmental-theme/findAll','downloadBase/get-url-file-s3',
            'downloadBase/getShapeByIdOrigin','geo/zip','municipalities/repeated',
            'baseURL','p3=','axios.create','recaptchaWarn','envTheme','csvFromTo'
          ]
          for anchor in anchors:
              print('\n'+'='*40,anchor,'='*40)
              start=0;hits=0
              while True:
                  i=text.find(anchor,start)
                  if i<0 or hits>=8: break
                  print(text[max(0,i-1600):min(len(text),i+2200)])
                  print('\n--- HIT ---\n')
                  start=i+len(anchor);hits+=1
          PY
