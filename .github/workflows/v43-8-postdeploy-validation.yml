name: Raio-X V43.8 Postdeploy Validation

on:
  push:
    branches: [ v43-8-postdeploy-validation ]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PORTAL: https://raio-x-territorial-app.onrender.com
      CAR: MG-3120904-E0C91FE86A3646D5AFA40786D6C554A9
      CONFLICT: MG-3120904-DB15158579EB4E07A0FE7ABFD922C7D3
    steps:
      - name: Validate live identity and name viewport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          portal=os.environ['PORTAL']; car=os.environ['CAR']; conflict=os.environ['CONFLICT']
          def get(path):
              req=urllib.request.Request(portal+path,headers={'User-Agent':'Raio-X-V43.8-Postdeploy'})
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r),dict(r.headers)
          a,_=get('/v1/live/property-identity/'+urllib.parse.quote(car,safe=''))
          b,_=get('/v1/live/property-identity/'+urllib.parse.quote(conflict,safe=''))
          q=urllib.parse.urlencode({'west':-44.72,'south':-19.22,'east':-44.62,'north':-19.12,'limit':60,'diagnostic':'true','car_visible':40})
          names,_=get('/v1/live/property-names/viewport?'+q)
          print('IDENTITY_POSITIVE',json.dumps(a,ensure_ascii=False))
          print('IDENTITY_CONFLICT',json.dumps(b,ensure_ascii=False))
          print('NAMES_COVERAGE',json.dumps(names.get('coverage') or {},ensure_ascii=False))
          print('NAMES_SAMPLE',json.dumps([(x.get('name'),x.get('source')) for x in (names.get('items') or [])[:20]],ensure_ascii=False))
          assert a.get('name')=='Fazenda Barrinha',a
          assert a.get('method')=='osm_named_farm_point_inside_car',a
          assert b.get('name') is None and b.get('osm_conflict') is True,b
          assert names.get('ok') is True,names
          assert int(names.get('count') or 0)>0,names
          assert any(x.get('name')=='Fazenda Barrinha' for x in (names.get('items') or [])),names
          cov=names.get('coverage') or {}
          assert int(cov.get('osm_names_returned') or 0)>0,cov
          open('evidence/live_identity.json','w').write(json.dumps({'positive':a,'conflict':b,'names':names},ensure_ascii=False,indent=2))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate desktop and mobile dossier flow
        shell: bash
        run: |
          cat > /tmp/v438_browser.py <<'PY'
          import asyncio, json, os
          from playwright.async_api import async_playwright
          PORTAL=os.environ['PORTAL']; CAR=os.environ['CAR']
          async def exercise(browser,width,height,label,mobile=False):
              ctx=await browser.new_context(viewport={'width':width,'height':height},is_mobile=mobile)
              page=await ctx.new_page(); errors=[]; bad422=[]
              page.on('pageerror',lambda e:errors.append(str(e)[:300]))
              page.on('response',lambda r:bad422.append(r.url) if r.status==422 and ('/v1/live/sicar/viewport' in r.url or '/v1/live/property-names/viewport' in r.url) else None)
              await page.goto(PORTAL,wait_until='domcontentloaded',timeout=60000)
              await page.wait_for_function("window.showProperty && document.querySelector('#map')",timeout=30000)
              snap=await page.evaluate("async c=>{let r=await fetch('/v1/live/snapshot/'+encodeURIComponent(c));return await r.json()}",CAR)
              p={'car_code':CAR,'municipality':snap.get('municipality'),'uf':snap.get('uf'),'area_ha':snap.get('area_ha'),'status':snap.get('car_status'),'condition':snap.get('condition'),'type':snap.get('property_type')}
              await page.evaluate("x=>window.showProperty(x.p,x.g)",{'p':p,'g':snap.get('geometry')})
              await page.wait_for_function("document.querySelector('#rx43Name')?.textContent.includes('Fazenda Barrinha')",timeout=30000)
              name=await page.locator('#rx43Name').inner_text()
              bodyclass=await page.locator('body').get_attribute('class') or ''
              assert 'rx43-dossier-open' in bodyclass,bodyclass
              await page.evaluate("window.__rxOpened=[];window.open=(u)=>{window.__rxOpened.push(u);return null}")
              await page.click('#rx43Pdf')
              opened=await page.evaluate("window.__rxOpened")
              assert opened and '/v1/mobile/report/open/' in opened[-1],opened
              before=await page.evaluate("()=>({lat:map.getCenter().lat,lng:map.getCenter().lng,z:map.getZoom()})")
              await page.screenshot(path=f'evidence/{label}_dossier.png',full_page=True)
              await page.click('#back')
              await page.wait_for_function("!document.body.classList.contains('rx43-dossier-open')",timeout=10000)
              after=await page.evaluate("()=>({lat:map.getCenter().lat,lng:map.getCenter().lng,z:map.getZoom()})")
              assert abs(before['lat']-after['lat'])<1e-7 and abs(before['lng']-after['lng'])<1e-7 and before['z']==after['z'],(before,after)
              await page.evaluate("x=>window.showProperty(x.p,x.g)",{'p':p,'g':snap.get('geometry')})
              await page.wait_for_function("document.querySelector('#rx43Name')?.textContent.includes('Fazenda Barrinha')",timeout=30000)
              await page.screenshot(path=f'evidence/{label}_reopen.png',full_page=True)
              assert not errors,errors
              assert not bad422,bad422
              print(label.upper(),json.dumps({'name':name,'opened':opened[-1],'before':before,'after':after,'errors':errors,'bad422':bad422},ensure_ascii=False))
              await ctx.close()
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  await exercise(b,1440,900,'desktop',False)
                  await exercise(b,390,844,'mobile',True)
                  await b.close()
          asyncio.run(main())
          PY
          python /tmp/v438_browser.py | tee evidence/browser.txt
      - name: Generate named V41 report through portal delegation
        shell: bash
        run: |
          set -euo pipefail
          echo 'Starting named report via portal resolver'
          curl -fsS --max-time 30 -X POST "$PORTAL/v1/mobile/report/prepare/$CAR" | tee evidence/prepare.json
          for i in $(seq 1 80); do
            curl -fsS --max-time 25 "$PORTAL/v1/mobile/report/status/$CAR" > evidence/status.json
            STATE=$(python -c "import json;print(json.load(open('evidence/status.json')).get('state',''))")
            NAME=$(python -c "import json;print(json.load(open('evidence/status.json')).get('property_name') or '')")
            echo "REPORT_STATUS attempt=$i state=$STATE name=$NAME"
            if [ "$STATE" = ready ]; then break; fi
            if [ "$STATE" = failed ]; then cat evidence/status.json; exit 1; fi
            sleep 3
          done
          python - <<'PY'
          import json
          d=json.load(open('evidence/status.json'))
          assert d.get('state')=='ready',d
          assert d.get('property_name')=='Fazenda Barrinha',d
          assert int(d.get('bytes') or 0)>100000,d
          print('REPORT_READY',d.get('elapsed_ms'),d.get('bytes'),d.get('property_name'))
          PY
          curl -fLsS --max-time 90 "$PORTAL/v1/mobile/report/open/$CAR" -o evidence/fazenda_barrinha.pdf
          test $(stat -c%s evidence/fazenda_barrinha.pdf) -gt 100000
          pdftotext -f 1 -l 1 evidence/fazenda_barrinha.pdf evidence/report_page1.txt
          grep -qi 'Fazenda Barrinha' evidence/report_page1.txt
          pdftoppm -f 1 -singlefile -png -r 120 evidence/fazenda_barrinha.pdf evidence/report_page1 >/dev/null 2>&1
          echo 'REPORT_PAGE1_TEXT:'
          cat evidence/report_page1.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raio-x-v43-8-postdeploy-validation
          path: evidence/
          retention-days: 14
