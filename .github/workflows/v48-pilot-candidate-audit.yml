name: V48 Pilot Candidate Audit

on:
  push:
    branches:
      - ops/v48-budget-gate-probe-20260908
    paths:
      - scripts/v48_pilot_candidate_audit.py
      - .github/workflows/v48-pilot-candidate-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-pilot-ufs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install BigQuery dependency
        run: pip install --disable-pip-version-check google-cloud-bigquery

      - name: Compare exact-snapshot geometry complexity
        run: python scripts/v48_pilot_candidate_audit.py

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-pilot-candidate-audit
          path: artifacts/v48_pilot_candidate_audit.json
          if-no-files-found: warn
          retention-days: 14
