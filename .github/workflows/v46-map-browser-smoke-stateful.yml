name: V46 Map Browser Smoke

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    # Measured locally on the W1A integration (loaded machine): V46 smoke 283 s, W1a boot smoke 27 s + cold server 14 s,
    # parcels smoke 88 s (103-160 s on the front), mutation controls 86 s (134-262 s), link smoke 96 s. ~10 min of smokes
    # plus install; 25 min keeps about 2x margin. V46 parcel click controls, two clicks per run: 37 s (local, 15/09).
    # Not measured, ceiling only: the live V46 smoke clicks 7 parcels and each click may wait up to 30 s (+3.5 min).
    timeout-minutes: 25
    env:
      RX_RELEASE: V8_OPERATIONAL_ZERO_COST
      RX_PORTAL_RSS_BUDGET_MB: '220'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx shapely pyproj pillow reportlab uvicorn "psycopg[binary]" "redis>=5,<7" "numpy>=2,<3" "rasterio>=1.4,<2" "PyJWT[crypto]>=2.10,<3" playwright
          python -m playwright install --with-deps chromium
      - name: Start V46 branch runtime and wait for deferred marker
        id: runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          echo "RX_V46_SMOKE_PYTHONPATH=$PYTHONPATH"
          uvicorn portal_api:app --host 127.0.0.1 --port 8000 > /tmp/rx-v46.log 2>&1 &
          echo $! > /tmp/rx-v46.pid
          ready=0
          for i in $(seq 1 90); do
            if ! kill -0 "$(cat /tmp/rx-v46.pid)" 2>/dev/null; then
              echo "runtime exited before deferred marker" > artifacts/runtime-start-failure.txt
              echo "::error::V46 runtime encerrou antes de ficar pronto. O browser smoke NÃO foi executado."
              tail -n 300 /tmp/rx-v46.log || true
              exit 1
            fi
            html="$(curl -fsS http://127.0.0.1:8000/ 2>/dev/null || true)"
            if [[ "$html" == *"RX_MAP_V46_TWO_LEVEL"* && "$html" == *"RX_MAP_V46_ANCHOR_STATE"* && "$html" == *"RX_MAP_V46_CLICK_PROPAGATION_GUARD"* && "$html" == *"RX_MAP_V46_DOM_EMPTY_CLOSE_GUARD"* ]]; then
              ready=1
              printf '%s' "$html" > artifacts/runtime-ready.html
              echo "RX_V46_DEFERRED_MARKERS=READY attempt=$i"
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "required V46 deferred markers missing after 90 seconds" > artifacts/runtime-start-failure.txt
            echo "::error::RX_V46_BROWSER_SMOKE_NOT_EXECUTED: o portal respondeu, mas os marcadores V46 obrigatórios não apareceram em até 90s. Falhando fechado; não existe skip silencioso."
            tail -n 300 /tmp/rx-v46.log || true
            exit 1
          fi
      - name: Selection card panel and 10-movement visual gate
        run: python .github/scripts/v46_browser_smoke.py
      # SICAR mocked: the parcel click used above must reach concave and edge-only parcels, and each broken
      # click rule (no dispatch, other CAR's card, parcels not interactive, card stuck on the first property clicked)
      # must fail at its own tag.
      - name: V46 parcel click helper (concave and edge-only parcels, mutation controls, SICAR mocked)
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: python .github/scripts/v46_browser_smoke.py --click-controls
      # The W1a steps below do not depend on live SICAR (fixtures or a spawned server), so they run even when the
      # live-SICAR smoke above failed (SICAR often does not answer GitHub runners); they only need the runtime.
      - name: W1a boot smoke (one navigation, CSS/JS failure recovery, failed boot page at 375/768/1440, cold server)
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: python .github/scripts/w1a_boot_browser_smoke.py --spawn 8311
      - name: W1a fast CAR parcels (cells, canvas, hysteresis, honest notice)
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: python .github/scripts/w1a_imoveis_rapidos_smoke.py
      - name: W1a mutation controls (each broken rule must turn the smoke red at its own check)
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: python .github/scripts/w1a_imoveis_rapidos_smoke.py --mutation-controls
      - name: W1a property link, share menu, polygon click and link notices (375 and 1440, SICAR mocked)
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: python .github/scripts/w1a_link_imovel_smoke.py
      - name: Enforce browser smoke execution
        if: always()
        run: |
          mkdir -p artifacts
          if [ ! -f artifacts/browser-executed.txt ]; then
            echo "::error::RX_V46_BROWSER_SMOKE_NOT_EXECUTED: Chromium não chegou a abrir. O job falha fechado; nenhum resultado skipped pode ser considerado aprovado."
            exit 1
          fi
          echo "RX_V46_BROWSER_EXECUTION_GUARD=PASS"
      - name: Runtime log on failure
        if: failure()
        run: |
          echo '--- V46 runtime log ---'
          tail -n 300 /tmp/rx-v46.log || true
      - name: Upload V46 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v46-map-browser-smoke-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
