name: V44 Step 1 PRODES Regression
on:
  push:
    branches: [ v44-step1-prodes-proof ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet shapely pyproj
      - name: Validate exact-union lens contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile prodes_lens.py prodes_truth_v44.py
          python - <<'PY'
          from prodes_lens import derive_prodes_lens
          # Synthetic CAR and overlapping post-cutoff polygons prove that the post lens
          # uses a union, not a naive sum. Coordinates are small WGS84 test geometries.
          car={'type':'Polygon','coordinates':[[[0,0],[0.02,0],[0.02,0.02],[0,0.02],[0,0]]]}
          old={'type':'Polygon','coordinates':[[[0,0],[0.02,0],[0.02,0.018],[0,0.018],[0,0]]]}
          recent1={'type':'Polygon','coordinates':[[[0.001,0.001],[0.006,0.001],[0.006,0.006],[0.001,0.006],[0.001,0.001]]]}
          recent2={'type':'Polygon','coordinates':[[[0.003,0.003],[0.008,0.003],[0.008,0.008],[0.003,0.008],[0.003,0.003]]]}
          p={'hits':[{'layer':'proof:yearly_deforestation','features':[
            {'id':'old','geometry':old,'properties':{'year':2006,'image_date':'2006-07-21'}},
            {'id':'r1','geometry':recent1,'properties':{'year':2021,'image_date':'2021-09-16'}},
            {'id':'r2','geometry':recent2,'properties':{'year':2022,'image_date':'2022-09-16'}},
          ]}]}
          lens=derive_prodes_lens(p,0.5,car_geometry=car,car_area_ha=49.236)
          h=lens['historical'];r=lens['post_2019_07_31']
          assert lens['calculation_method']=='exact_geometry_union_after_intersection', lens
          assert h['area_unique_ha'] > 0 and h['pct_car'] is not None, h
          assert r['occurrence_count']==2 and r['area_unique_ha'] > 0 and r['pct_car'] is not None, r
          # Union must be smaller than the sum of the two overlapping recent intersections.
          from shapely.geometry import shape
          from pyproj import Geod
          g=Geod(ellps='GRS80')
          def a(x):return abs(g.geometry_area_perimeter(shape(x))[0])/10000
          assert r['area_unique_ha'] < a(recent1)+a(recent2), (r,a(recent1),a(recent2))
          print('PRODES_TWO_LENS_CONTRACT_OK',lens)
          PY
      - name: Validate report labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('prodes_truth_v44.py').read_text(encoding='utf-8')
          for required in ('Histórico PRODES completo','Recorte pós-31/07/2019','ha únicos','% do CAR','Interseção geométrica exata'):
              assert required in p, required
          print('PRODES_REPORT_LABELS_OK')
          PY
