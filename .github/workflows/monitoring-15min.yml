name: Raio-X Territorial Monitoring

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check readiness and run monitoring
        env:
          STATUS_URL: https://raio-x-territorial-app.onrender.com/v1/monitoring/status
          MONITOR_URL: https://raio-x-territorial-app.onrender.com/v1/monitoring/run?limit=25
        run: |
          set -euo pipefail
          STATUS="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 90 "${STATUS_URL}")"
          echo "Monitoring status: ${STATUS}"
          READY="$(python -c 'import json,sys; d=json.load(sys.stdin); print("yes" if d.get("persistence")=="durable" else "no")' <<< "${STATUS}")"
          if [ "${READY}" != "yes" ]; then
            echo "::notice title=Raio-X monitoramento pausado::Persistência durável ainda não está vinculada. Execução manual encerrada sem falha."
            exit 0
          fi
          OIDC_JSON="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=raio-x-territorial-monitor")"
          OIDC_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "${OIDC_JSON}")"
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 540 -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" "${MONITOR_URL}"
