name: V48 Vector Pilot Pre-Batch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker-with-real-bigquery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      RX_V48_PILOT_UF: ES
      RX_V48_SNAPSHOT: '2026-08-04'
      RX_V48_ALLOW_NATIONAL: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: pip install --disable-pip-version-check google-cloud-bigquery google-cloud-storage shapely psutil

      - name: Compile worker and pre-Batch audit
        run: python -m py_compile scripts/v48_vector_pilot_worker.py scripts/v48_vector_pilot_prebatch.py

      - name: Assert frozen pilot contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          sys.path.insert(0, 'scripts')
          import v48_vector_pilot_worker as w
          p = json.load(open('config/v48_vector_pilot.json', encoding='utf-8'))
          w.assert_static_contract()
          assert w.UF == p['pilot_uf'] == 'ES'
          assert w.SNAPSHOT.isoformat() == p['snapshot_date'] == '2026-08-04'
          assert p['analysis_snapshot'] == p['map_snapshot'] == '2026-08-04'
          assert p['national_generation_allowed'] is False
          print('RX_V48_PREBATCH_STATIC_CONTRACT=PASS')
          PY

      - name: Audit worker SQL and ES geometry types on exact snapshot
        run: PYTHONPATH=scripts python scripts/v48_vector_pilot_prebatch.py

      - name: Upload pre-Batch evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v48-vector-pilot-prebatch-${{ github.run_id }}
          path: artifacts/v48_vector_pilot_prebatch.json
          if-no-files-found: warn
          retention-days: 14
