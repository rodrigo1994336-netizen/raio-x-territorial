name: V48 Batch Storage Preflight

on:
  push:
    branches:
      - ops/v48-budget-gate-probe-20260908
    paths:
      - config/v48_vector_pilot.json
      - scripts/v48_batch_storage_preflight.py
      - .github/workflows/v48-batch-storage-preflight.yml
  workflow_dispatch:

# Revalidation remains read-only; owner bootstrap is external to this workflow.
permissions:
  contents: read

jobs:
  read-only-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only preflight dependencies
        run: pip install --disable-pip-version-check google-auth requests

      - name: Verify pilot remains ES / exact snapshot / national disabled
        shell: bash
        run: |
          python - <<'PY'
          import json
          p = json.load(open('config/v48_vector_pilot.json', encoding='utf-8'))
          assert p['pilot_uf'] == 'ES'
          assert p['snapshot_date'] == '2026-08-04'
          assert p['analysis_snapshot'] == p['map_snapshot'] == '2026-08-04'
          assert p['national_generation_allowed'] is False
          print('RX_V48_PILOT_CONTRACT=ES_2026-08-04_NATIONAL_FALSE')
          PY

      - name: Probe Batch Storage APIs and IAM without mutation
        run: python scripts/v48_batch_storage_preflight.py

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-batch-storage-preflight
          path: artifacts/v48_batch_storage_preflight.json
          if-no-files-found: warn
          retention-days: 14
