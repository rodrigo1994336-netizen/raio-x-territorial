name: V44 SNCR Public Name Audit
on:
  push:
    branches: [ v44-property-sidebar ]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect SNCR public consultation and Curvelo target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,html
          from html.parser import HTMLParser

          class P(HTMLParser):
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag in ('form','input','select','option','button','a'):
                      keep={k:d.get(k) for k in ('id','name','type','value','action','method','href','onclick') if d.get(k) is not None}
                      if keep: print('TAG',tag,keep)

          url='https://sncr.serpro.gov.br/sncr-web/consultaPublica.jsf'
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Raio-X Territorial public-source audit)'})
          r=s.get(url,timeout=30,allow_redirects=True)
          print('GET',r.status_code,r.url,'bytes',len(r.content),'type',r.headers.get('content-type'))
          print('COOKIES',s.cookies.get_dict())
          P().feed(r.text)
          for i,line in enumerate(r.text.splitlines(),1):
              l=line.lower()
              if any(k in l for k in ['municip','estado','uf','csv','export','consultar','pesquisar','download','arquivo','javax.faces','viewstate','primefaces','remotecommand']):
                  print('HIT',i,re.sub(r'\s+',' ',html.unescape(line))[:1600])
          PY
