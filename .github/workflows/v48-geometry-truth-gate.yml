name: V48 Geometry Truth Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-truth-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zero is not absence gate
        run: python scripts/v48_zero_not_absence_gate.py

      - name: Static geometry truth gate before authentication
        run: python scripts/v48_geometry_truth_static_gate.py

      - name: Reject missing Google Cloud configuration
        shell: bash
        env:
          GCP_SA_KEY_PRESENT: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo 'GCP_PROJECT_ID ausente'; exit 2; }
          test "$GCP_PROJECT_ID" = 'metodo-afp-plataforma' || { echo 'Projeto GCP inesperado'; exit 2; }
          test -n "$GCP_SA_KEY_PRESENT" || { echo 'GCP_SA_KEY ausente'; exit 2; }

      - name: Authenticate read-only geometry regression to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install BigQuery client
        run: pip install --disable-pip-version-check google-cloud-bigquery

      - name: Verify real Polygon GeometryCollection and no-geometry cases
        run: python scripts/v48_geometry_truth_real_gate.py

      - name: Upload immutable geometry truth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-geometry-truth-${{ github.run_id }}
          path: artifacts/v48_geometry_truth_real_gate.json
          if-no-files-found: warn
          retention-days: 30
