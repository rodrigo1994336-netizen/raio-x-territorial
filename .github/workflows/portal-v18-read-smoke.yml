name: Raio-X Portal V20 Mobile Read Smoke

on:
  push:
    paths:
      - '.github/workflows/portal-v18-read-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: https://raio-x-territorial-app.onrender.com
      REPORT: https://raio-x-territorial-report.onrender.com
      CAR: MG-3120904-DFB380BECD7A4323AD8AA68FA14D011F
    steps:
      - name: Wait for V20 portal
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            if curl -fsS --max-time 20 "$BASE/" | grep -q 'RX_MOBILE_DOSSIER_V20'; then
              echo 'V20 mobile runtime is live'
              exit 0
            fi
            sleep 8
          done
          echo 'V20 marker not found after wait window' >&2
          exit 1
      - name: Read and time public endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          curl -fsS --max-time 30 "$BASE/" -o smoke/portal.html
          curl -fsS --max-time 35 -w '%{time_total}' -o smoke/viewport_no_uf.json "$BASE/v1/live/sicar/viewport?west=-44.48&south=-18.83&east=-44.35&north=-18.68&limit=20" > smoke/viewport_seconds.txt
          curl -fsS --max-time 30 -w '%{time_total}' -o smoke/monitoring_status.json "$BASE/v1/monitoring/status" > smoke/monitor_seconds.txt
          curl -fsS --max-time 60 -w '%{time_total}' -o smoke/identity.json "$BASE/v1/live/property-identity/$CAR" > smoke/identity_seconds.txt
          curl -fsS --max-time 90 -w '%{time_total}' -o smoke/groundwater.json "$BASE/v1/live/groundwater/$CAR?radius_km=20" > smoke/water_seconds.txt
          curl -fsS --max-time 100 -w '%{time_total}' -o smoke/mining.json "$BASE/v1/live/critical-minerals/$CAR" > smoke/mining_seconds.txt
          curl -fsS --max-time 180 -w '%{time_total}' -o smoke/heavy.json "$REPORT/v1/heavy/agro-raster/$CAR" > smoke/heavy_seconds.txt
          curl -fsS --max-time 210 -w '%{time_total}' -o smoke/agro.json "$BASE/v1/live/agropecuaria/$CAR" > smoke/agro_seconds.txt
      - name: Assert V20 operational state
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('smoke'); rd=lambda n:json.load(open(p/(n+'.json')))
          html=(p/'portal.html').read_text(encoding='utf-8')
          vp=rd('viewport_no_uf');st=rd('monitoring_status');ident=rd('identity');water=rd('groundwater');mining=rd('mining');heavy=rd('heavy');agro=rd('agro')
          assert 'RX_MOBILE_DOSSIER_V20' in html
          assert len(vp.get('features') or [])>0 and 'MG' in (vp.get('ufs_consultadas') or [vp.get('uf')]), vp
          assert st.get('ok') is True and st.get('backend') in ('redis','postgres'), st
          assert ident.get('ok') is True, ident
          assert water.get('ok') is True, water
          assert mining.get('ok') is True, mining
          assert heavy.get('ok') is True, heavy
          assert agro.get('ok') is True and agro.get('heavy_worker')=='report-service', agro
          pasture=agro.get('pasture') or {}
          assert pasture.get('state')=='ready', pasture
          for n in ('viewport','monitor','identity','water','mining','heavy','agro'):
              print(n, (p/(n+'_seconds.txt')).read_text().strip(), 'seconds')
          print('VIEWPORT_FEATURES',len(vp.get('features') or []))
          print('WATER_WELLS',water.get('well_count'))
          print('MINING_STATE',mining.get('state'),'ANM',mining.get('anm_available'),'SGB',mining.get('sgb_available'))
          print('PASTURE_HA',pasture.get('pasture_area_ha'),'PASTURE_PCT',pasture.get('pasture_share_pct'))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raio-x-portal-v20-mobile-read-smoke
          path: smoke/
          retention-days: 14
