name: V44 Step 1 Production PDF Proof

on:
  push:
    branches: [ v44-step1-prodes-proof ]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER: https://raio-x-territorial-report.onrender.com
      CAR: MG-3120904-DFB380BECD7A4323AD8AA68FA14D011F
    steps:
      - name: Wait for report worker
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 15 "$WORKER/v1/reports/property/$CAR/status" -o status.json; then
              cat status.json
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Generate benchmark report
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -X POST "$WORKER/v1/reports/property/$CAR/prepare" -o prepare.json
          ready=0
          for i in $(seq 1 60); do
            sleep 4
            curl -fsS --max-time 20 "$WORKER/v1/reports/property/$CAR/status" -o status.json
            state=$(python -c "import json;print(json.load(open('status.json')).get('state',''))")
            echo "state=$state"
            if [ "$state" = ready ]; then ready=1; break; fi
            if [ "$state" = failed ]; then cat status.json; exit 1; fi
          done
          test "$ready" = 1
          curl -fsS --max-time 60 "$WORKER/v1/reports/property/$CAR" -o benchmark.pdf
      - name: Verify PDF text
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          r=PdfReader('benchmark.pdf')
          text='\n'.join((p.extract_text() or '') for p in r.pages)
          open('benchmark.txt','w',encoding='utf-8').write(text)
          checks=['Histórico PRODES completo','Recorte pós-31/07/2019','14.496704','0.027909']
          for x in checks:
              assert x in text, x
          normalized=text.replace(',','.')
          assert '97.98%' in normalized, '97.98%'
          assert '0.19%' in normalized, '0.19%'
          print('PRODES_PDF_PROOF_OK pages=',len(r.pages),'bytes=',__import__('os').path.getsize('benchmark.pdf'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v44-step1-benchmark-pdf
          path: |
            benchmark.pdf
            benchmark.txt
            status.json
          retention-days: 14
