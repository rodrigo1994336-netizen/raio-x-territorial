name: V44 Step 2 CAFIR Share HTML Probe
on:
  push:
    branches: [ v44-step2-cafir-webdav ]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public share HTML
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --connect-timeout 15 --max-time 45 'https://arquivos.receitafederal.gov.br/index.php/s/RRmcpB2tf5cXskz' -o share.html
          echo "bytes=$(wc -c < share.html)" | tee clues.txt
          echo '=== INITIAL STATE ===' | tee -a clues.txt
          grep -Eio '.{0,160}(initial-state|sharingToken|shareToken|public-files|webdav|downloadUrl|fileList).{0,240}' share.html | head -200 | tee -a clues.txt || true
          echo '=== SCRIPT ROUTE CLUES ===' | tee -a clues.txt
          grep -Eo 'src="[^"]+"' share.html | tail -30 | tee -a clues.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v44-step2-cafir-share-html
          path: clues.txt
          retention-days: 3
