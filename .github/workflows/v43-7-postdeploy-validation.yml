name: Raio-X V43.7 Postdeploy Validation

on:
  push:
    branches: [ v43-7-postdeploy-validation ]

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PORTAL: https://raio-x-territorial-app.onrender.com
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate MG Curvelo backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl -fsS --max-time 60 -w '\nHTTP_STATUS=%{http_code}\nTIME=%{time_total}\n' "$PORTAL/v1/live/search/advanced?uf=MG&municipality=Curvelo&limit=40" | tee evidence/curvelo.txt
          python - <<'PY'
          import json,re
          t=open('evidence/curvelo.txt').read()
          body=t.split('\nHTTP_STATUS=')[0]
          status=int(re.search(r'HTTP_STATUS=(\d+)',t).group(1))
          d=json.loads(body)
          print('STATUS',status,'COUNT',d.get('count'),'MUNICIPALITY',d.get('municipality'),'UF',d.get('uf'),'TRUNCATED',d.get('truncated'))
          print('FIRST',[(x.get('name'),x.get('car_code'),x.get('area_ha')) for x in (d.get('items') or [])[:5]])
          assert status==200,status
          assert d.get('ok') is True,d
          assert d.get('uf')=='MG',d
          assert int(d.get('count') or 0)>0,d
          assert len(d.get('items') or [])>0,d
          PY
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate automatic UF plus municipality search
        run: |
          cat > /tmp/auto_search.py <<'PY'
          import asyncio, json, os
          from playwright.async_api import async_playwright
          PORTAL=os.environ['PORTAL']
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  page=await b.new_page(viewport={'width':1440,'height':900})
                  errors=[]; requests=[]
                  page.on('pageerror',lambda e:errors.append(str(e)[:300]))
                  page.on('request',lambda r:requests.append(r.url) if '/v1/live/search/advanced' in r.url else None)
                  await page.goto(PORTAL,wait_until='domcontentloaded',timeout=60000)
                  await page.wait_for_selector('#rxAdvTrigger',state='visible',timeout=30000)
                  await page.click('#rxAdvTrigger')
                  await page.select_option('#rxAdvUf','MG')
                  await page.fill('#rxAdvCity','Curvelo')
                  await page.wait_for_function("document.querySelectorAll('.rx-adv-card').length>0",timeout=30000)
                  cards=await page.locator('.rx-adv-card').count()
                  status=await page.locator('#rxAdvStatus').inner_text()
                  print('AUTO_REQUESTS',requests)
                  print('AUTO_CARDS',cards)
                  print('AUTO_STATUS',status)
                  assert cards>0,cards
                  assert any('uf=MG' in u and 'municipality=Curvelo' in u for u in requests),requests
                  assert not errors,errors
                  await page.screenshot(path='evidence/auto_search_curvelo.png',full_page=True)
                  await b.close()
          asyncio.run(main())
          PY
          python /tmp/auto_search.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raio-x-v43-7-postdeploy-validation
          path: evidence/
          retention-days: 14
