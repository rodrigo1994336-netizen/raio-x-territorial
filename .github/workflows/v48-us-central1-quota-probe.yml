name: V48 US Central1 Read-only Quota Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      TARGET_REGION: us-central1
    steps:
      - uses: actions/checkout@v4

      - name: Reject missing Google Cloud configuration
        shell: bash
        run: |
          test -n "$GCP_PROJECT_ID" || { echo 'GCP_PROJECT_ID ausente'; exit 2; }
          test -n "$GCP_SA_KEY_PRESENT" || { echo 'GCP_SA_KEY ausente'; exit 2; }
        env:
          GCP_SA_KEY_PRESENT: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Read Compute quota through Service Usage only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export PROJECT_NUMBER="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')"
          test -n "$PROJECT_NUMBER" || { echo 'project number unavailable'; exit 3; }
          export ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base = (
              'https://serviceusage.googleapis.com/v1beta1/projects/'
              + os.environ['PROJECT_NUMBER']
              + '/services/compute.googleapis.com/consumerQuotaMetrics'
          )
          token = os.environ['ACCESS_TOKEN']
          metrics = []
          page_token = None
          while True:
              query = {'view': 'FULL', 'pageSize': '200'}
              if page_token:
                  query['pageToken'] = page_token
              req = urllib.request.Request(
                  base + '?' + urllib.parse.urlencode(query),
                  headers={'Authorization': 'Bearer ' + token},
              )
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.load(resp)
              metrics.extend(data.get('metrics', []))
              page_token = data.get('nextPageToken')
              if not page_token:
                  break
          if not metrics:
              raise SystemExit('Service Usage returned no Compute quota metrics')
          out = {
              'source_api': 'serviceusage.googleapis.com/v1beta1/consumerQuotaMetrics',
              'project_number': os.environ['PROJECT_NUMBER'],
              'target_region': os.environ['TARGET_REGION'],
              'metrics': metrics,
          }
          p = Path('artifacts/v48_compute_quota_info_raw.json')
          p.write_text(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('RX_V48_SERVICE_USAGE_QUOTA_METRICS=' + str(len(metrics)))
          print('RX_V48_SERVICE_USAGE_QUOTA_READ=PASS')
          PY

      - name: Print governing us-central1 quota values
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/v48_compute_quota_info_raw.json').read_text(encoding='utf-8'))
          by_metric = {m.get('metric'): m for m in data['metrics']}

          def get_bucket(metric, unit, region=None):
              item = by_metric[metric]
              limit = next(x for x in item['consumerQuotaLimits'] if x.get('unit') == unit)
              for bucket in limit.get('quotaBuckets', []):
                  dims = bucket.get('dimensions') or {}
                  if region is None and not dims:
                      return bucket
                  if dims.get('region') == region:
                      return bucket
              raise SystemExit(f'quota bucket missing: {metric} {unit} {region}')

          standard = get_bucket('compute.googleapis.com/cpus', '1/{project}/{region}', 'us-central1')
          preemptible = get_bucket('compute.googleapis.com/preemptible_cpus', '1/{project}/{region}', 'us-central1')
          global_cpu = get_bucket('compute.googleapis.com/cpus_all_regions', '1/{project}')
          regional_limit = int(standard['effectiveLimit'])
          global_limit = int(global_cpu['effectiveLimit'])
          preemptible_limit = preemptible.get('effectiveLimit')
          governing = min(regional_limit, global_limit)
          print('RX_V48_US_CENTRAL1_STANDARD_CPU_LIMIT=' + str(regional_limit))
          print('RX_V48_US_CENTRAL1_PREEMPTIBLE_CPU_LIMIT=' + (str(preemptible_limit) if preemptible_limit is not None else 'NOT_SEPARATELY_GRANTED'))
          print('RX_V48_CPUS_ALL_REGIONS_LIMIT=' + str(global_limit))
          print('RX_V48_SPOT_E2_STATIC_GOVERNING_LIMIT=' + str(governing))
          print('RX_V48_E2_STANDARD_8_THEORETICAL_MAX_CONCURRENCY=' + str(governing // 8))
          PY

      - name: Upload raw quota evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-us-central1-quota-probe
          path: artifacts/v48_compute_quota_info_raw.json
          if-no-files-found: warn
          retention-days: 14
