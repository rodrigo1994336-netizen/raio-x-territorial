name: V48 US Central1 Read-only Quota Probe
# recovery-trigger-cloud-quotas-quiet: 2026-09-08

on:
  push:
    branches:
      - ops/v48-budget-gate-probe-20260908
    paths:
      - .github/workflows/v48-us-central1-quota-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      TARGET_REGION: us-central1
    steps:
      - uses: actions/checkout@v4

      - name: Reject missing Google Cloud configuration
        shell: bash
        run: |
          test -n "$GCP_PROJECT_ID" || { echo 'GCP_PROJECT_ID ausente'; exit 2; }
          test -n "$GCP_SA_KEY_PRESENT" || { echo 'GCP_SA_KEY ausente'; exit 2; }
        env:
          GCP_SA_KEY_PRESENT: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Read Compute Engine QuotaInfo only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gcloud --quiet beta quotas info list \
            --project="$GCP_PROJECT_ID" \
            --billing-project="$GCP_PROJECT_ID" \
            --service=compute.googleapis.com \
            --format=json > artifacts/v48_compute_quota_info_raw.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/v48_compute_quota_info_raw.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if not data:
              raise SystemExit('Cloud Quotas returned no Compute Engine quota info')
          print('RX_V48_CLOUD_QUOTAS_ITEMS=' + str(len(data)))
          print('RX_V48_CLOUD_QUOTAS_READ=PASS')
          PY

      - name: Upload raw quota evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-us-central1-quota-probe
          path: artifacts/v48_compute_quota_info_raw.json
          if-no-files-found: warn
          retention-days: 14
