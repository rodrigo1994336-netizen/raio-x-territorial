name: Raio-X Quality Gate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx shapely pyproj pillow reportlab uvicorn "psycopg[binary]" "redis>=5,<7" "numpy>=2,<3" "rasterio>=1.4,<2" "PyJWT[crypto]>=2.10,<3"
      - name: Compile Python modules
        run: |
          python -m py_compile \
            climate_nasa.py groundwater_siagas.py safras_ibge.py satellite_real.py soilgrids_wcs.py \
            sicar_detail_sources.py sicar_detail_sources_v2.py aerodromes_anac.py property_search.py property_identity_runtime.py property_names_viewport_v30.py map_context.py \
            territorial_production.py portal_boot_guard_v26.py portal_resource_guard_v27.py portal_property_tabs.py portal_live_fix_v18.py portal_smart_search.py portal_map_context_symbols.py portal_mobile_v19.py portal_nationwide_v21.py portal_property_names_v30.py portal_field_mode_v31.py portal_map_visual_v32.py portal_territorial_production_v33.py portal_mining_resilience_v34.py portal_premium_ux_v35.py portal_legacy_source_cleanup.py portal_mobile_dossier_v20.py portal_human_reading_v23.py portal_pdf_v21.py portal_action_runtime_v25.py \
            portal_rare_earth_symbols.py portal_property_identity_v13.py report_book_style.py property_visual_plate_v25.py \
            report_engine_v6.py report_engine_v7.py report_engine_v8.py rasterio_runtime_bootstrap.py redis_runtime_bootstrap.py sentinel_cog.py \
            highres_reference.py street_level_access.py visual_hybrid.py terrain_srtm.py mapbiomas_coverage.py heavy_live_api_v20.py \
            prodes_fast_v24.py anm_fast_v29.py core_retry_fast_v29.py report_perf_v24.py report_truth_guard_v16.py report_pdf_cache_v21.py report_quick_v22.py live_report_adapter_v12.py live_report_adapter_v13.py \
            live_report_adapter_v14.py live_report_adapter_v15.py live_report_adapter_v16.py live_report_adapter_v17.py live_report_adapter_v18.py report_visual_identity_v28.py \
            github_oidc_auth.py jwt_runtime_bootstrap.py monitoring_store.py monitoring_routes.py alerts_routes.py \
            report_v13_patch.py report_v14_patch.py report_v15_patch.py report_v16_patch.py report_v17_patch.py report_v18_patch.py sitecustomize.py
      - name: Import standalone engines
        env:
          RX_RELEASE: OFF
        run: |
          python - <<'PY'
          import climate_nasa, groundwater_siagas, safras_ibge, satellite_real
          import soilgrids_wcs, sicar_detail_sources_v2, aerodromes_anac, sentinel_cog, mapbiomas_coverage
          import highres_reference, street_level_access, visual_hybrid, terrain_srtm, property_visual_plate_v25
          import prodes_fast_v24, anm_fast_v29, core_retry_fast_v29, territorial_production
          import report_truth_guard_v16, report_book_style, report_engine_v6, report_engine_v7, report_engine_v8
          import live_report_adapter_v18, report_visual_identity_v28, heavy_live_api_v20, report_pdf_cache_v21, report_quick_v22, github_oidc_auth, monitoring_store, monitoring_routes, alerts_routes
          print('RX_CI_IMPORT_OK')
          PY
      - name: V35 premium field portal gate
        env:
          RX_RELEASE: V8_OPERATIONAL_ZERO_COST
          RX_PORTAL_RSS_BUDGET_MB: '220'
        run: |
          python - <<'PY'
          import time
          import sitecustomize
          import portal_api
          import portal_boot_guard_v26
          deadline=time.time()+12
          while time.time()<deadline and not portal_boot_guard_v26.STATE.get('ready') and not portal_boot_guard_v26.STATE.get('error'):
              time.sleep(.1)
          assert portal_boot_guard_v26.STATE.get('ready'), portal_boot_guard_v26.STATE
          import portal_v8, portal_action_runtime_v25, portal_resource_guard_v27
          paths={getattr(r,'path',None) for r in portal_v8.app.router.routes}
          missing=[x for x in portal_action_runtime_v25.REQUIRED_ROUTES if x not in paths]
          assert not missing, f'missing routes: {missing}'
          for path in ('/v1/live/property-names/viewport','/sw.js','/v1/live/territorial-production/{car_code}','/v1/live/critical-minerals/{car_code}'):
              assert path in paths, f'missing V35 route: {path}'
          html=portal_v8.PORTAL_HTML
          required=('RX_ACTION_RUNTIME_V25','RX_PDF_V25','rxMobileFull','rxPropertyTabs','rxFilterBtn','rxBootGuard','RX_PROPERTY_NAMES_V30','RX_FIELD_MODE_V31','RX_MAP_VISUAL_V32','RX_TERRITORIAL_PRODUCTION_V33','RX_PREMIUM_UX_V35','__rxClimateCacheV35','rx-dossier-open','rx-filter-open')
          absent=[x for x in required if x not in html]
          assert not absent, f'missing UI/action markers: {absent}'
          assert 'serviceWorker.register' in html
          assert 'rxParcelStyle' in html
          assert 'Produção e território' in html
          assert 'NÃO CONCLUÍDO' in html, 'mining fail-soft UI missing'
          assert '7 dias' in html and '30 dias' in html and '1 ano' in html, 'climate range labels missing'
          assert 'Atualizando período' in html, 'non-destructive climate refresh missing'
          assert "mm.fitBounds(bounds.pad(.22),{maxZoom:11,animate:true})" not in html, 'rare-earth filter must not auto-move map'
          assert 'schedulePrepare' not in html
          heavy=portal_resource_guard_v27._heavy_loaded()
          assert not heavy, f'heavy modules leaked into portal: {heavy}'
          rss=portal_resource_guard_v27._rss_bytes()/1024/1024
          assert rss < 220, f'portal RSS too high in gate: {rss:.1f} MB'
          print('RX_CI_PORTAL_V35_READY',len(paths),'rss_mb=',round(rss,1))
          PY
