name: Raio-X Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx shapely pyproj pillow reportlab uvicorn "psycopg[binary]" "redis>=5,<7" "numpy>=2,<3" "rasterio>=1.4,<2" "PyJWT[crypto]>=2.10,<3"
      - name: Compile Python modules
        run: |
          python -m compileall -q .
      - name: Import standalone engines
        env:
          RX_RELEASE: OFF
        run: |
          python - <<'PY'
          import climate_nasa, groundwater_siagas, safras_ibge, satellite_real, whatsapp_gateway
          import soilgrids_wcs, sicar_detail_sources_v2, aerodromes_anac, sentinel_cog, mapbiomas_coverage
          import highres_reference, street_level_access, visual_hybrid, terrain_srtm, property_visual_plate_v25
          import prodes_fast_v24, anm_fast_v29, core_retry_fast_v29, territorial_production, landuse_profile_v39
          import report_truth_guard_v16, report_book_style, report_engine_v6, report_engine_v7, report_engine_v8
          import live_report_adapter_v18, report_visual_identity_v28, report_extras_perf_v30, heavy_live_api_v20, report_pdf_cache_v21, report_quick_v22, github_oidc_auth, monitoring_store, monitoring_routes, alerts_routes
          sample={'ok':True,'source':'MapBiomas','year':2025,'native_vegetation_share_pct':20,'classes':[{'code':15,'share_pct':55},{'code':39,'share_pct':25}]}
          p=landuse_profile_v39.classify_landuse_profile(sample)
          assert 'livestock_pasture' in p['profile_codes'] and 'soy' in p['profile_codes'] and 'mixed_agro' in p['profile_codes']
          print('RX_CI_IMPORT_OK')
          PY
      - name: V43 portal simplification and reliability gate
        env:
          RX_RELEASE: V8_OPERATIONAL_ZERO_COST
          RX_PORTAL_RSS_BUDGET_MB: '220'
        run: |
          python - <<'PY'
          import time
          from pathlib import Path
          import sitecustomize
          import portal_api
          import portal_boot_guard_v26
          deadline=time.time()+12
          while time.time()<deadline and not portal_boot_guard_v26.STATE.get('ready') and not portal_boot_guard_v26.STATE.get('error'):
              time.sleep(.1)
          assert portal_boot_guard_v26.STATE.get('ready'), portal_boot_guard_v26.STATE
          import portal_v8, portal_action_runtime_v25, portal_resource_guard_v27
          paths={getattr(r,'path',None) for r in portal_v8.app.router.routes}
          missing=[x for x in portal_action_runtime_v25.REQUIRED_ROUTES if x not in paths]
          assert not missing, f'missing routes: {missing}'
          required_routes=(
              '/v1/live/snapshot/{car_code}',
              '/v1/live/property-identity/{car_code}',
              '/v1/live/property-names/viewport',
              '/v1/live/sicar/viewport',
              '/v1/live/resolve',
              '/sw.js',
              '/v1/live/territorial-production/{car_code}',
              '/v1/live/critical-minerals/{car_code}',
              '/v1/live/search/advanced',
              '/v1/live/search/landuse-profiles',
          )
          for path in required_routes:
              assert path in paths, f'missing V43 route: {path}'
          assert sum(1 for r in portal_v8.app.router.routes if getattr(r,'path',None)=='/v1/live/search/advanced')==1
          assert str(portal_v8.APP_PORTAL_VERSION).startswith('0.43.'), portal_v8.APP_PORTAL_VERSION
          html=portal_v8.PORTAL_HTML
          required=(
              'RX_EXPERIENCE_V43','SNAPSHOT DO IMÓVEL','VER ANÁLISE COMPLETA',
              'body.rx43-dossier-open #map','rx43-dossier-open','rx43-full-requested',
              'RX_ACTION_RUNTIME_V25','RX_FIELD_MODE_V43','RX_MAP_VISUAL_V32',
              'RX_PROPERTY_NAMES_V40','RX_ADVANCED_SEARCH_V39','rxAdvTrigger',
              'serviceWorker.register','rxParcelStyle','window.rxVisibleCarCountV43',
              'window.rxNameCoverageV43','window.rxGetNameCoverageV43',
              'Busque um município, mova o mapa ou use “Minha localização”.',
              'Mapa ajustando…',
          )
          absent=[x for x in required if x not in html]
          assert not absent, f'missing V43 UI/action markers: {absent}'
          retired=(
              'RX_PORTAL_IDENTITY_V18','RX_MOBILE_DOSSIER_V20','RX_HUMAN_READING_V23',
              'RX_PREMIUM_UX_V35','RX_PREMIUM_INTERACTIONS_V36','RX_LAYOUT_GUARD_V37',
              'RX_PREMIUM_COPY_V38','RX_RELIABILITY_V40','rxPrefetchV40','loadingV40',
          )
          leaked=[x for x in retired if x in html]
          assert not leaked, f'retired UI leaked into V43: {leaked}'
          assert 'setTimeout(locateUser,350)' not in html, 'automatic geolocation prompt leaked into V43 startup'
          prod=Path('portal_territorial_production_v33.py').read_text()
          alerts=Path('portal_alerts.py').read_text()
          field=Path('portal_field_mode_v31.py').read_text()
          names=Path('portal_property_names_v30.py').read_text()
          names_backend=Path('property_names_viewport_v30.py').read_text()
          release=Path('portal_release_v43.py').read_text()
          site=Path('sitecustomize.py').read_text()
          assert 'setInterval' not in prod and 'MutationObserver' not in prod
          assert 'route_only_no_legacy_tab_timer' in prod
          assert 'setInterval' not in alerts and 'MutationObserver' not in alerts
          assert 'registered_ui_dormant_until_durable_persistence' in alerts
          assert "rx-field-v43" in field and 'staleWhileRevalidate' in field
          assert "/v1/live/snapshot/" in field and "/v1/live/property-identity/" in field and "'/v1/live/resolve'" in field
          assert "function schedule(){clearTimeout(timer);timer=setTimeout(refresh,420)}" not in field
          assert "u.searchParams.set('limit',z>=15?'60':'35');" not in field
          assert 'window.rxFieldMode' in names and 'limitFor(z)' in names and 'Nomes já carregados · atualização pendente' in names
          assert 'window.rxNameCoverageV43' in names and "u.searchParams.set('car_visible'" in names and "u.searchParams.set('diagnostic','true')" in names and 'names_rendered' in names
          assert 'dossierOpen()' in names and 'east>west&&north>south' in names
          assert "'sigef_candidates'" in names_backend and "'sigef_with_valid_name'" in names_backend and "'sigef_named_with_valid_geometry'" in names_backend
          assert "'car_visible'" in names_backend and 'RX_PROPERTY_NAMES_COVERAGE=' in names_backend and 'diagnostic:bool=False' in names_backend
          assert "0.43.4-v43-snapshot-first" in release and 'window.rxVisibleCarCountV43' in release
          assert 'RX_GEOLOCATION_V43=explicit_user_action_only' in release and '_auto_locate' in release
          assert 'RX_VIEWPORT_GUARD_V43=dossier_and_positive_area' in release and '_viewport_loader' in release and '_viewport_bounds' in release
          assert 'portal_release_v43' in site and 'v43_name_coverage_counter_not_loaded' in site
          assert 'Fontes pesadas não foram disparadas' in html
          assert 'IMÓVEL RURAL — NOME NÃO CONFIRMADO' in html
          assert 'z<11' in html and 'span>1.50' in html
          assert all(uf in html for uf in ('AC','AM','BA','DF','GO','MG','MT','PA','PR','RS','SC','SP','TO'))
          observer_count=html.count('MutationObserver')
          interval_count=html.count('setInterval(')
          assert observer_count==0, f'global DOM observers remain: {observer_count}'
          assert interval_count==0, f'global polling intervals remain: {interval_count}'
          heavy=portal_resource_guard_v27._heavy_loaded()
          assert not heavy, f'heavy modules leaked into portal: {heavy}'
          rss=portal_resource_guard_v27._rss_bytes()/1024/1024
          assert rss < 220, f'portal RSS too high in gate: {rss:.1f} MB'
          print('RX_CI_PORTAL_V43_READY',len(paths),'rss_mb=',round(rss,1),'mutation_observers=',observer_count,'intervals=',interval_count,'version=',portal_v8.APP_PORTAL_VERSION,'name_coverage=observable','viewport_guard=on','geolocation=explicit')
          PY
      - name: V41 report bounded-latency and CAR-composition gate
        env:
          RX_RELEASE: OFF
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('anm_fast_v29.py').read_text()
          r=Path('core_retry_fast_v29.py').read_text()
          s=Path('sitecustomize.py').read_text()
          sent=Path('sentinel_cog.py').read_text()
          hi=Path('highres_reference.py').read_text()
          extras=Path('report_extras_perf_v30.py').read_text()
          car=Path('sicar_detail_sources_v2.py').read_text()
          adapter=Path('live_report_adapter_v17.py').read_text()
          assert "--max-time','7'" in a and "--retry','0'" in a
          assert 'anm_retry=skipped' in r and "query_anm_fast" not in r
          assert 'report_extras_perf_v30' in s
          assert 'landuse_profile_v39' in s and 'portal_advanced_search_v39' in s and 'portal_advanced_name_v40' in s and 'portal_experience_v43' in s
          assert 'portal_reliability_v40' not in s
          assert 'SIGEF/INCRA + SICAR spatial match' in Path('portal_advanced_name_v40.py').read_text()
          assert 'async def _read4' in sent and 'items[:2]' in sent and "'GDAL_HTTP_TIMEOUT':'9'" in sent
          assert 'httpx.Timeout(12,connect=5)' in hi
          assert 'ThreadPoolExecutor' in car and 'CAP_TTL=21600' in car and "'share_pct'" in car
          assert 'asyncio.wait_for' in extras and "_timed('visual_hybrid'" in extras and ',34)' in extras
          assert "car['environmental_composition']" in adapter and 'passivo/excedente legal' in adapter
          print('RX_CI_REPORT_V41_READY')
          PY
