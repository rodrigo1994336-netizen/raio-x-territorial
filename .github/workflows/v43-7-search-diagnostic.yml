name: Raio-X V43.7 Search Diagnostic

on:
  push:
    branches: [ v43-7-search-city ]

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PORTAL: https://raio-x-territorial-app.onrender.com
    steps:
      - name: Probe MG Curvelo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl -sS --max-time 60 -w '\nHTTP_STATUS=%{http_code}\nTIME=%{time_total}\n' "$PORTAL/v1/live/search/advanced?uf=MG&municipality=Curvelo&limit=40" | tee evidence/curvelo.txt
          python - <<'PY'
          import json,re
          t=open('evidence/curvelo.txt').read()
          body=t.split('\nHTTP_STATUS=')[0]
          status=int(re.search(r'HTTP_STATUS=(\d+)',t).group(1))
          print('STATUS',status)
          if status==200:
              d=json.loads(body)
              print('COUNT',d.get('count'),'MUNICIPALITY',d.get('municipality'),'UF',d.get('uf'),'TRUNCATED',d.get('truncated'))
              print('FIRST_CARS',[x.get('car_code') for x in (d.get('items') or [])[:5]])
          else:
              print('BODY',body[:1000])
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raio-x-v43-7-search-diagnostic
          path: evidence/
          retention-days: 14
