name: Raio-X V43.8 Identity Diagnostic

on:
  push:
    branches: [ v43-8-identity-diagnostic ]

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SIGEF: https://pamgia.ibama.gov.br/server/rest/services/01_Publicacoes_Bases/lim_imovel_sigef_publico_a/FeatureServer/10/query
    steps:
      - name: Measure Curvelo SIGEF coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          sigef=os.environ['SIGEF']
          headers={'User-Agent':'Raio-X-V43.8-Diagnostic'}
          def call(params):
              url=sigef+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r),url
          tests=[]
          for label,where in (
              ('all_curvelo','municipio_=3120904'),
              ('named_curvelo',"municipio_=3120904 AND nome_area IS NOT NULL AND nome_area <> ''"),
              ('all_layer','1=1'),
          ):
              data,url=call({'f':'json','where':where,'returnCountOnly':'true'})
              row={'label':label,'where':where,'count':data.get('count'),'error':data.get('error'),'url':url}
              tests.append(row);print('COUNT',json.dumps(row,ensure_ascii=False))
          data,url=call({'f':'json','where':"municipio_=3120904 AND nome_area IS NOT NULL AND nome_area <> ''",'outFields':'objectid,parcela_co,codigo_imo,nome_area,registro_m,municipio_,uf_id,status,situacao_i','returnGeometry':'false','resultRecordCount':'50','orderByFields':'objectid ASC'})
          feats=data.get('features') or []
          samples=[f.get('attributes') or {} for f in feats]
          print('SAMPLES',json.dumps(samples[:20],ensure_ascii=False))
          out={'tests':tests,'sample_count':len(samples),'samples':samples}
          open('evidence/curvelo_sigef_coverage.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raio-x-v43-8-curvelo-sigef-coverage
          path: evidence/
          retention-days: 14
