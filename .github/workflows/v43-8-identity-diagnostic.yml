name: Raio-X V43.8 Identity Diagnostic

on:
  push:
    branches: [ v43-8-identity-diagnostic ]

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public identity sources for Curvelo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          headers={'User-Agent':'Raio-X-V43.8-Diagnostic'}
          # Official Curvelo bbox from Nominatim geocoding.
          nom='https://nominatim.openstreetmap.org/search?'+urllib.parse.urlencode({'q':'Curvelo, Minas Gerais, Brasil','format':'jsonv2','countrycodes':'br','limit':'5','addressdetails':'1'})
          with urllib.request.urlopen(urllib.request.Request(nom,headers=headers),timeout=30) as r: rows=json.load(r)
          chosen=next(x for x in rows if 'minas gerais' in str((x.get('address') or {}).get('state') or '').lower() or str((x.get('address') or {}).get('ISO3166-2-lvl4') or '').upper()=='BR-MG')
          south,north,west,east=map(float,chosen['boundingbox']); bbox=[west,south,east,north]
          out={'bbox':bbox}

          # INCRA Acervo Fundiario official WFS: check whether it is reachable outside Render.
          base='https://acervofundiario.incra.gov.br/i3geo/ogc.php'
          cap=base+'?'+urllib.parse.urlencode({'tema':'imoveiscertificados_privado_mg','service':'WFS','request':'GetCapabilities'})
          p=subprocess.run(['curl','-k','-sS','-L','--connect-timeout','8','--max-time','25','-A','Raio-X-V43.8-Diagnostic',cap],capture_output=True,text=True)
          out['incra']={'returncode':p.returncode,'bytes':len(p.stdout.encode()),'stderr':p.stderr[:300],'preview':p.stdout[:500]}
          print('INCRA',json.dumps(out['incra'],ensure_ascii=False))

          # OSM/Overpass named rural features, as a public fallback candidate source.
          q=f'''[out:json][timeout:35];(nwr["name"]["place"="farm"]({south},{west},{north},{east});nwr["name"]["landuse"="farmyard"]({south},{west},{north},{east});nwr["name"]["landuse"="farmland"]({south},{west},{north},{east}););out center tags 300;'''
          body=urllib.parse.urlencode({'data':q}).encode()
          req=urllib.request.Request('https://overpass-api.de/api/interpreter',data=body,headers={'User-Agent':'Raio-X-V43.8-Diagnostic','Content-Type':'application/x-www-form-urlencoded'})
          try:
              with urllib.request.urlopen(req,timeout=60) as r: osm=json.load(r)
              elems=osm.get('elements') or []
              named=[]
              for e in elems:
                  tags=e.get('tags') or {}; name=str(tags.get('name') or '').strip()
                  if not name: continue
                  c=e.get('center') or {'lat':e.get('lat'),'lon':e.get('lon')}
                  named.append({'type':e.get('type'),'id':e.get('id'),'name':name,'lat':c.get('lat'),'lon':c.get('lon'),'place':tags.get('place'),'landuse':tags.get('landuse'),'source':'OpenStreetMap'})
              out['osm']={'count':len(named),'sample':named[:100]}
          except Exception as e:
              out['osm']={'error':type(e).__name__+':'+str(e)[:300],'count':-1,'sample':[]}
          print('OSM_COUNT',out['osm'].get('count'))
          print('OSM_SAMPLE',json.dumps(out['osm'].get('sample',[])[:30],ensure_ascii=False))
          open('evidence/curvelo_public_name_sources.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raio-x-v43-8-public-name-sources
          path: evidence/
          retention-days: 14
