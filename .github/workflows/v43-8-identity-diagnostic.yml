name: Raio-X V43.8 Identity Diagnostic

on:
  push:
    branches: [ v43-8-identity-diagnostic ]

permissions:
  contents: read
  actions: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORTAL: https://raio-x-territorial-app.onrender.com
    steps:
      - name: Download captured Curvelo public-name evidence
        uses: actions/download-artifact@v5
        with:
          name: raio-x-v43-8-public-name-sources
          path: evidence/source
          github-token: ${{ github.token }}
          run-id: 33991594540
      - name: Match captured OSM farm names to exact SICAR CAR polygons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, json, os, urllib.error, urllib.parse, urllib.request
          portal=os.environ['PORTAL']; headers={'User-Agent':'Raio-X-V43.8-Diagnostic'}
          src=json.load(open('evidence/source/curvelo_public_name_sources.json'))
          candidates=src.get('osm',{}).get('sample') or []
          print('OSM_CANDIDATES',len(candidates))
          def resolve(x):
              u=portal+'/v1/live/resolve?'+urllib.parse.urlencode({'lat':x['lat'],'lon':x['lon']})
              try:
                  req=urllib.request.Request(u,headers=headers)
                  with urllib.request.urlopen(req,timeout=35) as r: d=json.load(r)
                  prop=d.get('property') or d.get('item') or {}
                  car=prop.get('car_code') or prop.get('cod_imovel') or d.get('car_code')
                  return {**x,'resolved':bool(car),'car_code':car,'municipality':prop.get('municipality') or prop.get('municipio'),'uf':prop.get('uf'),'area_ha':prop.get('area_ha') or prop.get('area'),'raw_keys':sorted(d.keys())[:20]}
              except urllib.error.HTTPError as ex:
                  return {**x,'resolved':False,'http':ex.code}
              except Exception as ex:
                  return {**x,'resolved':False,'error':type(ex).__name__+':'+str(ex)[:160]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              rows=list(ex.map(resolve,candidates))
          resolved=[x for x in rows if x.get('resolved')]
          matched=[x for x in resolved if str(x.get('car_code') or '').upper().startswith('MG-3120904-')]
          by={}
          for x in matched: by.setdefault(x['car_code'],[]).append(x)
          safe=[]; conflicts=[]
          for car,items in by.items():
              unique={x['name'].casefold():x['name'] for x in items}; names=sorted(unique.values(),key=str.casefold)
              if len(names)==1:
                  safe.append({'car_code':car,'name':names[0],'area_ha':items[0].get('area_ha'),'evidence_count':len(items),'osm':[{'type':x.get('type'),'id':x.get('id'),'lat':x['lat'],'lon':x['lon'],'place':x.get('place'),'landuse':x.get('landuse')} for x in items]})
              else:
                  conflicts.append({'car_code':car,'names':names,'items':items})
          safe.sort(key=lambda x:(-x['evidence_count'],x['name']))
          out={'osm_candidates':len(candidates),'resolved_any_car':len(resolved),'resolved_curvelo_points':len(matched),'unique_curvelo_cars':len(by),'safe_single_name_cars':len(safe),'conflicting_cars':len(conflicts),'safe':safe,'conflicts':conflicts,'rows':rows}
          print('MATCH_SUMMARY',json.dumps({k:out[k] for k in ('osm_candidates','resolved_any_car','resolved_curvelo_points','unique_curvelo_cars','safe_single_name_cars','conflicting_cars')},ensure_ascii=False))
          print('SAFE_MATCHES',json.dumps(safe[:30],ensure_ascii=False))
          print('CONFLICTS',json.dumps(conflicts[:10],ensure_ascii=False))
          open('evidence/curvelo_osm_car_matches.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          assert len(candidates)==84,('unexpected candidate count',len(candidates))
          assert len(safe)>0,'no exact OSM farm name -> Curvelo CAR match found'
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raio-x-v43-8-osm-car-matches
          path: evidence/curvelo_osm_car_matches.json
          retention-days: 14
