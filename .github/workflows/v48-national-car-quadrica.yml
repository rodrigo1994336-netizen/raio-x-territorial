name: V48 National CAR Quadrícula

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite GENERATE_27_UFS ou GENERATE_MISSING_9'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v48-national-car-quadrica-canonical-25e14900
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require explicit national authorization token
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          case "$CONFIRMATION" in
            GENERATE_27_UFS) echo 'RX_V48_NATIONAL_AUTHORIZATION=ACCEPTED scope=FULL_27' ;;
            GENERATE_MISSING_9) echo 'RX_V48_NATIONAL_AUTHORIZATION=ACCEPTED scope=MISSING_9 targets=AC,BA,GO,MA,MG,PA,RS,SC,SP' ;;
            *) echo 'RX_V48_NATIONAL_AUTHORIZATION=REJECTED'; exit 2 ;;
          esac

      - name: Compile every Python script before any paid compute
        run: python -m compileall -q scripts

      - name: Package closure gate before any paid compute
        run: python scripts/v48_national_batch_submit.py --package-check

      - name: Run national invariant gate before any paid compute
        run: python scripts/v48_national_static_gate.py

  generate-by-uf:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        uf: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      RX_V48_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reject missing Google Cloud configuration
        shell: bash
        env:
          GCP_SA_KEY_PRESENT: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo 'GCP_PROJECT_ID ausente'; exit 2; }
          test "$GCP_PROJECT_ID" = 'metodo-afp-plataforma' || { echo 'Projeto GCP inesperado'; exit 2; }
          test -n "$GCP_SA_KEY_PRESENT" || { echo 'GCP_SA_KEY ausente'; exit 2; }

      - name: Authenticate orchestrator to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install orchestrator dependencies
        run: pip install --disable-pip-version-check google-auth requests google-cloud-storage

      - name: Submit, observe and verify exactly one UF
        shell: bash
        run: |
          if [ "$RX_V48_CONFIRMATION" = 'GENERATE_MISSING_9' ]; then
            python scripts/v48_national_batch_submit.py --uf '${{ matrix.uf }}' --missing-only
          else
            python scripts/v48_national_batch_submit.py --uf '${{ matrix.uf }}'
          fi

      - name: Upload immutable UF execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-national-uf-${{ matrix.uf }}-a${{ github.run_attempt }}
          path: |
            artifacts/national/${{ matrix.uf }}.json
            artifacts/national/${{ matrix.uf }}.log
          if-no-files-found: warn
          retention-days: 14

  finalize-real-measurements:
    needs: generate-by-uf
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all UF evidence from all available attempts
        uses: actions/download-artifact@v4
        with:
          pattern: v48-national-uf-*
          path: artifacts/uf-results
          merge-multiple: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consolidate real size, time, BigQuery and failure measurements
        run: python scripts/v48_national_finalize.py --input-dir artifacts/uf-results --output artifacts/v48_national_generation_summary.json

      - name: Upload national real-measurement summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-national-generation-summary-a${{ github.run_attempt }}
          path: artifacts/v48_national_generation_summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail closed unless all 27 UFs are committed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/v48_national_generation_summary.json').read_text(encoding='utf-8'))
          if not data['all_27_published']:
              raise SystemExit('RX_V48_NATIONAL_WORKFLOW=PARTIAL_FAIL_CLOSED failed_ufs=' + ','.join(data['failed_ufs']))
          print('RX_V48_NATIONAL_WORKFLOW=ALL_27_COMMITTED')
          PY
