name: V47 Real BigQuery Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-national-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RX_BIGQUERY_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      RX_ADMIN_MUNICIPALITY_TABLE: basedosdados.br_geobr_mapas.municipio
      RX_ADMIN_UF_TABLE: basedosdados.br_geobr_mapas.estado
      RX_BIGQUERY_MAX_BYTES_BILLED: ${{ vars.RX_BIGQUERY_MAX_BYTES_BILLED || '42949672960' }}
      RX_V47_SAMPLE_UFS: ${{ vars.RX_V47_SAMPLE_UFS || 'AM,BA,MT,MG,PR' }}
      RX_V47_NATIONAL_VALIDATION_APPROVED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject missing Google Cloud secret configuration
        shell: bash
        env:
          GCP_SA_KEY_PRESENT: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID_PRESENT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          test -n "$GCP_SA_KEY_PRESENT" || { echo 'GCP_SA_KEY ausente'; exit 2; }
          test -n "$GCP_PROJECT_ID_PRESENT" || { echo 'GCP_PROJECT_ID ausente'; exit 2; }
      - name: Authenticate to Google Cloud from GitHub secret
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Install V47 real-gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery google-auth shapely pyproj
      - name: Run V47 real checks with truthful UF-presence label
        run: PYTHONPATH=. python scripts/v47_block2_real_bigquery_gate_name_truth.py
      - name: Dump Curvelo client-facing values
        run: PYTHONPATH=. python scripts/v47_curvelo_client_dump.py
