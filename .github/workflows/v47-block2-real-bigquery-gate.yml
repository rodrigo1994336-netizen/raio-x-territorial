name: V47 Block 2 Real BigQuery Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-national-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RX_BIGQUERY_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      RX_ADMIN_MUNICIPALITY_TABLE: basedosdados.br_geobr_mapas.municipio
      RX_ADMIN_UF_TABLE: basedosdados.br_geobr_mapas.estado
      # 40 GiB hard ceiling per executed query after explicit cost review; still fail-closed above it.
      RX_BIGQUERY_MAX_BYTES_BILLED: ${{ vars.RX_BIGQUERY_MAX_BYTES_BILLED || '42949672960' }}
      RX_V47_SAMPLE_UFS: ${{ vars.RX_V47_SAMPLE_UFS || 'AM,BA,MT,MG,PR' }}
      # National validation is locked by default after the successful hardened full-national run.
      RX_V47_NATIONAL_VALIDATION_APPROVED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject missing Google Cloud secret configuration
        shell: bash
        env:
          GCP_SA_KEY_PRESENT: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID_PRESENT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          test -n "$GCP_SA_KEY_PRESENT" || { echo 'GCP_SA_KEY ausente'; exit 2; }
          test -n "$GCP_PROJECT_ID_PRESENT" || { echo 'GCP_PROJECT_ID ausente'; exit 2; }
      - name: Authenticate to Google Cloud from GitHub secret
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Install V47 real-gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery google-auth shapely pyproj
      - name: D1 name coverage national count - DRY RUN ONLY
        run: PYTHONPATH=. python scripts/d1_name_coverage_dryrun.py
      - name: Upload D1 dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: d1-name-coverage-dryrun
          path: artifacts/d1_name_coverage_dryrun.json
          if-no-files-found: error
          retention-days: 14

      - name: D1 name coverage national count - EXECUTE under reviewed 1 GiB cap
        run: PYTHONPATH=. python scripts/d1_name_coverage_count.py
      - name: Upload D1 exact count evidence
        uses: actions/upload-artifact@v4
        with:
          name: d1-name-coverage-count
          path: artifacts/d1_name_coverage_count.json
          if-no-files-found: error
          retention-days: 14

      - name: Confirm authorized admin schema, estimate cost, then run real V47 gate
        run: |
          PYTHONPATH=. python - <<'PY'
          import runpy
          import sicar_overlap_hardening_v47
          runpy.run_path('scripts/v47_block2_real_bigquery_gate.py', run_name='__main__')
          PY
      - name: Dump Curvelo client-facing values
        run: |
          PYTHONPATH=. python scripts/v47_curvelo_client_dump.py
