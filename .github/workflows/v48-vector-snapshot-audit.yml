name: V48 Vector Snapshot Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-sicar-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Reject missing Google Cloud configuration
        shell: bash
        run: |
          test -n "$GCP_PROJECT_ID" || { echo 'GCP_PROJECT_ID ausente'; exit 2; }
          test -n "$GCP_SA_KEY_PRESENT" || { echo 'GCP_SA_KEY ausente'; exit 2; }
        env:
          GCP_SA_KEY_PRESENT: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install BigQuery dependency
        run: pip install --disable-pip-version-check google-cloud-bigquery

      - name: Audit exact SICAR snapshot 2026-08-04
        run: python scripts/v48_vector_snapshot_audit.py

      - name: Print all 27 exact-snapshot UF counts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {'AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'}
          data = json.loads(Path('artifacts/v48_vector_snapshot_audit.json').read_text(encoding='utf-8'))
          assert data['target_snapshot'] == '2026-08-04'
          assert set(data['ufs']) == expected
          complete = []
          for uf in sorted(expected):
              item = data['ufs'][uf]
              stats = item.get('area_stats') or {}
              cars = stats.get('distinct_car_count')
              if cars is None:
                  print(f'RX_V48_UF_COUNT_{uf}=MISSING_EXACT_PARTITION')
              else:
                  print(f'RX_V48_UF_COUNT_{uf}={int(cars)}')
              if item.get('snapshot_complete'):
                  complete.append(uf)
          print('RX_V48_EXACT_SNAPSHOT_COMPLETE_UFS=' + ','.join(complete))
          print('RX_V48_EXACT_SNAPSHOT_COMPLETE_UF_COUNT=' + str(len(complete)))
          print('RX_V48_EXACT_SNAPSHOT_NATIONAL=' + ('PASS' if len(complete) == 27 else 'BLOCKED'))
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-vector-snapshot-audit
          path: artifacts/v48_vector_snapshot_audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail closed if the exact national snapshot is incomplete
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/v48_vector_snapshot_audit.json').read_text(encoding='utf-8'))
          missing = sorted(uf for uf, item in data['ufs'].items() if not item.get('snapshot_complete'))
          if missing:
              raise SystemExit('RX_V48_NATIONAL_SNAPSHOT_BLOCKED missing exact 2026-08-04 UFs: ' + ','.join(missing))
          print('RX_V48_NATIONAL_SNAPSHOT_GATE=PASS')
          PY
