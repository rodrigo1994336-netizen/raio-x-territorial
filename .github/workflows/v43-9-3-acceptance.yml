name: Raio-X V43 Names Coverage One Shot

on:
  push:
    branches: [ v43-9-3-acceptance ]

permissions:
  contents: read

jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTAL: https://raio-x-territorial-app.onrender.com
    steps:
      - name: Capture diagnostic coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl -fsS --max-time 30 "$PORTAL/v1/live/property-names/viewport?west=-44.75&south=-19.25&east=-44.35&north=-19.00&limit=35&diagnostic=true&car_visible=35" -o evidence/names_coverage.json
          python - <<'PY'
          import json
          d=json.load(open('evidence/names_coverage.json'))
          print('NAMES_COVERAGE',json.dumps(d,ensure_ascii=False))
          assert d.get('ok') is True,d
          assert isinstance(d.get('coverage'),dict),d
          assert isinstance(d.get('items'),list),d
          assert d.get('count',0)>0,d
          assert d.get('coverage',{}).get('names_returned',0)>0,d
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raio-x-v43-names-coverage
          path: evidence/
          retention-days: 14
