name: Raio-X V43.9.5 Acceptance

on:
  push:
    branches: [ v43-9-3-acceptance ]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PORTAL: https://raio-x-territorial-app.onrender.com
      CAR: MG-3120904-E0C91FE86A3646D5AFA40786D6C554A9
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate viewer, return flow, deep PDF action and mobile controls
        run: |
          mkdir -p evidence
          cat > /tmp/accept.py <<'PY'
          import asyncio, json, os, time
          from pathlib import Path
          from playwright.async_api import async_playwright

          PORTAL=os.environ['PORTAL'].rstrip('/'); CAR=os.environ['CAR']

          def overlap(a,b):
              if not a or not b:return False
              return not (a['x']+a['width']<=b['x'] or b['x']+b['width']<=a['x'] or a['y']+a['height']<=b['y'] or b['y']+b['height']<=a['y'])

          async def portal_ready(page):
              await page.goto(PORTAL,wait_until='domcontentloaded',timeout=60000)
              await page.wait_for_timeout(1800)
              await page.wait_for_selector('#q',state='visible',timeout=30000)
              await page.wait_for_function("typeof window.rxOpenReportViewer==='function'",timeout=30000)

          async def select_car(page):
              await portal_ready(page)
              await page.locator('#q').fill(CAR)
              await page.locator('#go').click()
              await page.wait_for_selector('#rx43Pdf',state='visible',timeout=90000)
              assert await page.locator('body').evaluate("b=>b.classList.contains('rx43-dossier-open')")

          async def wait_pdf(viewer,ctx,tag,timeout=320000):
              await viewer.wait_for_load_state('domcontentloaded',timeout=30000)
              assert '/v1/mobile/report/view/' in viewer.url,viewer.url
              assert await viewer.get_by_text('VOLTAR AO RAIO-X').is_visible()
              started=time.monotonic()
              await viewer.wait_for_selector('#rxPdfFrame',state='visible',timeout=timeout)
              ready_s=round(time.monotonic()-started,2)
              assert await viewer.locator('#rxOpenPdf').is_visible()
              href=await viewer.locator('#rxOpenPdf').get_attribute('href')
              assert href and '/v1/mobile/report/open/' in href,href
              resp=await ctx.request.get(PORTAL+href,timeout=60000)
              body=await resp.body(); ctype=(resp.headers.get('content-type') or '').lower()
              assert resp.ok,(resp.status,ctype,len(body))
              assert 'pdf' in ctype,(ctype,len(body))
              assert len(body)>100000,len(body)
              await viewer.screenshot(path=f'evidence/{tag}_viewer.png',full_page=True)
              return {'ready_seconds':ready_s,'pdf_bytes':len(body),'content_type':ctype,'viewer_url':viewer.url}

          async def desktop(browser):
              ctx=await browser.new_context(viewport={'width':1440,'height':900},service_workers='block')
              page=await ctx.new_page();errors=[]
              page.on('pageerror',lambda e: errors.append(str(e)[:300]))
              await select_car(page)
              await page.screenshot(path='evidence/desktop_snapshot.png',full_page=True)

              async with page.expect_popup(timeout=15000) as pop:
                  await page.locator('#rx43Pdf').click()
              viewer=await pop.value
              snap=await wait_pdf(viewer,ctx,'desktop_snapshot_pdf')
              await viewer.locator('.back').click();await page.wait_for_timeout(900)
              assert viewer.is_closed(),'desktop viewer did not close'
              assert not page.is_closed(),'original app closed'
              assert await page.locator('#rx43Pdf').is_visible(),'dossier not preserved after PDF return'

              await page.locator('#rx43Full').click()
              deep=page.locator('button[onclick*="downloadPDF"], .downloads .btn').first
              await deep.wait_for(state='visible',timeout=120000)
              deep_text=(await deep.inner_text()).strip()
              async with page.expect_popup(timeout=15000) as pop2:
                  await deep.click()
              viewer2=await pop2.value
              deep_result=await wait_pdf(viewer2,ctx,'desktop_deep_pdf',timeout=90000)
              await viewer2.locator('.back').click();await page.wait_for_timeout(700)
              assert viewer2.is_closed(),'deep viewer did not close'
              assert not errors,errors
              out={'snapshot':snap,'deep':deep_result,'deep_button':deep_text,'return_to_app':True,'dossier_preserved':True}
              Path('evidence/desktop_result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
              print('DESKTOP_ACCEPTANCE',json.dumps(out,ensure_ascii=False))
              await ctx.close()

          async def standalone_mobile(browser):
              ctx=await browser.new_context(viewport={'width':390,'height':844},is_mobile=True,service_workers='block')
              await ctx.add_init_script("""
              (()=>{const orig=window.matchMedia.bind(window);window.matchMedia=(q)=>{if(q==='(display-mode: standalone)')return {matches:true,media:q,onchange:null,addListener(){},removeListener(){},addEventListener(){},removeEventListener(){},dispatchEvent(){return true}};return orig(q)}})();
              """)
              page=await ctx.new_page();errors=[]
              page.on('pageerror',lambda e: errors.append(str(e)[:300]))
              await select_car(page)
              await page.locator('#rx43Pdf').click()
              await page.wait_for_url('**/v1/mobile/report/view/**',timeout=20000)
              assert await page.get_by_text('VOLTAR AO RAIO-X').is_visible()
              await page.wait_for_selector('#rxPdfFrame',state='visible',timeout=90000)
              await page.screenshot(path='evidence/pwa_pdf_viewer.png',full_page=True)
              await page.locator('.back').click()
              await page.wait_for_url(PORTAL+'/**',timeout=30000)
              await page.wait_for_selector('#q',state='visible',timeout=30000)

              sels=['.rx-basemap-switch','#rxLocateBtn','#rxFilterBtn'];boxes=[]
              for s in sels:
                  loc=page.locator(s).first
                  assert await loc.is_visible(),s
                  boxes.append((s,await loc.bounding_box()))
              for i in range(len(boxes)):
                  for j in range(i+1,len(boxes)):
                      assert not overlap(boxes[i][1],boxes[j][1]),(boxes[i],boxes[j])
              await page.screenshot(path='evidence/mobile_controls.png',full_page=True)
              out={'standalone_same_tab':True,'returned_to_app':True,'overlap':False,'boxes':boxes,'errors':errors}
              assert not errors,errors
              Path('evidence/mobile_result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
              print('MOBILE_ACCEPTANCE',json.dumps(out,ensure_ascii=False))
              await ctx.close()

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  await desktop(browser)
                  await standalone_mobile(browser)
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/accept.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raio-x-v43-9-5-acceptance
          path: evidence/
          retention-days: 14
