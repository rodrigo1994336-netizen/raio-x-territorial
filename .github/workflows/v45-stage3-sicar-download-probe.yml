name: V45 Stage 3 SICAR municipal download probe

on:
  push:
    branches: [ v45-stage3-car-composition ]
    paths:
      - '.github/workflows/v45-stage3-sicar-download-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect GeoServices public SPA and endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          ROOT='https://consulta.car.gov.br/geoservices/'
          curl -k -L -sS --connect-timeout 12 --max-time 60 "$ROOT" -o probe/index.html
          echo '=== HTML ==='
          cat probe/index.html
          echo
          echo '=== script/assets ==='
          grep -Eo '(src|href)="[^"]+"' probe/index.html || true
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('probe/index.html').read_text(encoding='utf-8',errors='ignore')
          refs=[]
          for x in re.findall(r'(?:src|href)="([^"]+)"',html):
              if x.endswith('.js') or '.js?' in x:
                  refs.append(x)
          root='https://consulta.car.gov.br'
          for i,ref in enumerate(refs):
              url=ref if ref.startswith('http') else root+(ref if ref.startswith('/') else '/geoservices/'+ref)
              out=Path(f'probe/app_{i}.js')
              subprocess.run(['curl','-k','-L','-sS','--connect-timeout','12','--max-time','90',url,'-o',str(out)],check=False)
              print('JS',i,url,'bytes',out.stat().st_size if out.exists() else 0)
          PY
          echo '=== endpoint-like strings ==='
          grep -RhoE 'https?://[^"'"'"' )]+' probe/*.js | sort -u | head -200 || true
          grep -RhoE '/[A-Za-z0-9_.?=&{}:/-]*(download|Download|SHP|shape|municip|tema|estado)[A-Za-z0-9_.?=&{}:/-]*' probe/*.js | sort -u | head -300 || true
