name: V44 Step 2 SICAR MG Count
on:
  push:
    branches: [ v44-step2-car-mg-count ]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe MG SICAR CSV export
        run: |
          set -euo pipefail
          B='https://geoserver.car.gov.br/geoserver/sicar/ows'
          T0=$(date +%s)
          curl -sS --fail --get "$B" --data-urlencode 'service=WFS' --data-urlencode 'version=2.0.0' --data-urlencode 'request=GetFeature' --data-urlencode 'typeNames=sicar:sicar_imoveis_mg' --data-urlencode 'outputFormat=csv' --data-urlencode 'propertyName=cod_imovel,area,municipio,uf,status_imovel,condicao' --data-urlencode 'count=10000' --data-urlencode 'startIndex=0' -o sample.csv
          T1=$(date +%s)
          printf 'SECONDS=%s\nBYTES=%s\nLINES=%s\n' "$((T1-T0))" "$(wc -c < sample.csv)" "$(wc -l < sample.csv)" > proof.txt
          head -20 sample.csv >> proof.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v44-step2-car-mg-count
          path: proof.txt
          retention-days: 3
