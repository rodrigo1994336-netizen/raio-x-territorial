name: V44 Name Source Audit
on:
  push:
    branches: [ v44-property-sidebar ]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Extract exact SICAR public property endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re
          base='https://consultapublica.car.gov.br/publico/public/javascripts/'
          h={'User-Agent':'Mozilla/5.0 (Raio-X Territorial public-source audit)'}
          for path in ['layers/imovel.js','search-button.js','imoveis.js']:
              r=requests.get(base+path,headers=h,timeout=20)
              print('\nFILE',path,'status',r.status_code,'bytes',len(r.content))
              txt=r.text
              for i,line in enumerate(txt.splitlines(),1):
                  l=line.lower()
                  if any(k in l for k in ['$.ajax','$.get','$.post','url:','demonstrativo','imovel/','imoveis/','codigo','cod_imovel','nome','denomin','car']):
                      print(f'{i}: {line[:900]}')
          PY
