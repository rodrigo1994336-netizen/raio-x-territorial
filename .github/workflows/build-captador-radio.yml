name: Build Captador Radio APK

on:
  push:
    branches:
      - feature/escala-facil-captador-radio
    paths:
      - "captador-radio/**"
      - ".github/workflows/build-captador-radio.yml"
      - "!captador-radio/CaptadorRadio-debug.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: captador-radio
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        run: cp captador-radio/app/build/outputs/apk/debug/app-debug.apk captador-radio/CaptadorRadio-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptadorRadio-debug
          path: captador-radio/CaptadorRadio-debug.apk

      - name: Commit APK to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captador-radio/CaptadorRadio-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build Captador Rádio APK [skip ci]"
            git push
          fi
