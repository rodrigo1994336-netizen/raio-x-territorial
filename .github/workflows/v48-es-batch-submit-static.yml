name: V48 ES Batch Submit Static Gate

on:
  push:
    branches:
      - ops/v48-budget-gate-probe-20260908
    paths:
      - scripts/v48_es_batch_submit.py
      - scripts/v48_vector_pilot_worker.py
      - config/v48_vector_pilot.json
      - .github/workflows/v48-es-batch-submit-static.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-single-attempt-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import dependencies
        run: pip install --disable-pip-version-check google-auth requests
      - name: Compile submitter and worker
        run: python -m py_compile scripts/v48_es_batch_submit.py scripts/v48_vector_pilot_worker.py
      - name: Assert exact paid-resource contract without GCP mutation
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import v48_es_batch_submit as s
          cfg = s.assert_frozen_contract()
          sha, b64 = s.worker_payload()
          job = s.build_job(sha, b64)
          tg = job['taskGroups'][0]
          spec = tg['taskSpec']
          policy = job['allocationPolicy']['instances'][0]['policy']
          disk = policy['disks'][0]
          assert s.JOB_ID == 'rx-v48-es-sicar-20260804-pilot-001'
          assert cfg['pilot_uf'] == 'ES'
          assert cfg['snapshot_date'] == '2026-08-04'
          assert cfg['analysis_snapshot'] == cfg['map_snapshot'] == '2026-08-04'
          assert cfg['national_generation_allowed'] is False
          assert tg['taskCount'] == '1' and tg['parallelism'] == '1'
          assert spec['maxRetryCount'] == 0
          assert spec['maxRunDuration'] == '3600s'
          assert policy['machineType'] == 'e2-standard-8'
          assert policy['provisioningModel'] == 'SPOT'
          assert disk['newDisk']['type'] == 'pd-balanced'
          assert disk['newDisk']['sizeGb'] == '100'
          assert job['allocationPolicy']['serviceAccount']['email'] == s.RUNTIME_SA
          assert s.TIPPECANOE_VERSION == '2.79.0'
          assert s.TIPPECANOE_SHA256 == 'b0fd9df49b6efc988288ea48774822c6de19eb48428017f27ee0b3b01d44f05d'
          assert len(b64) > 1000
          print(f'RX_V48_ES_SUBMIT_STATIC_WORKER_SHA={sha}')
          print('RX_V48_ES_SUBMIT_STATIC_JOB_ID=rx-v48-es-sicar-20260804-pilot-001')
          print('RX_V48_ES_SUBMIT_STATIC_RESOURCES=ONE_SPOT_E2_STANDARD_8_PD_BALANCED_100GB')
          print('RX_V48_ES_SUBMIT_STATIC_RETRY=0')
          print('RX_V48_ES_SUBMIT_STATIC_NATIONAL=FALSE')
          print('RX_V48_ES_BATCH_SUBMIT_STATIC_GATE=PASS')
          PY
