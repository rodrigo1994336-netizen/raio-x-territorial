name: V48 ES Batch Submit Static Gate

on:
  push:
    branches:
      - ops/v48-budget-gate-probe-20260908
    paths:
      - scripts/v48_es_batch_submit.py
      - scripts/v48_es_paid_gate.py
      - scripts/v48_vector_pilot_worker.py
      - config/v48_vector_pilot.json
      - .github/workflows/v48-es-batch-pilot.yml
      - .github/workflows/v48-es-batch-submit-static.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-single-attempt-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import dependencies
        run: pip install --disable-pip-version-check google-auth requests
      - name: Compile all Python gate and execution code
        run: >-
          python -m py_compile
          scripts/v48_es_batch_submit.py
          scripts/v48_es_paid_gate.py
          scripts/v48_vector_pilot_worker.py
      - name: Assert exact paid-resource contract and runnable syntax without GCP mutation
        run: python scripts/v48_es_paid_gate.py
