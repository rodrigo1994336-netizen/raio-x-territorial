name: V48 ES Single Spot Pilot

on:
  workflow_dispatch:

# PERMANENT COST-SAFETY RULE:
# Any workflow that can create paid cloud compute MUST be manually dispatched.
# Never add push, pull_request, schedule, workflow_run, or other automatic triggers here.
permissions:
  contents: read

jobs:
  one-es-spot-attempt:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      RX_V48_PILOT_UF: ES
      RX_V48_SNAPSHOT: '2026-08-04'
      RX_V48_ALLOW_NATIONAL: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install orchestration dependencies
        run: pip install --disable-pip-version-check google-auth requests

      - name: Compile paid gate and execution code before any paid mutation
        run: >-
          python -m py_compile
          scripts/v48_es_batch_submit.py
          scripts/v48_es_paid_gate.py
          scripts/v48_vector_pilot_worker.py

      - name: Re-run post-bootstrap preflight immediately before paid mutation
        run: python scripts/v48_batch_storage_preflight.py

      - name: Re-assert single-attempt ES contract and runnable syntax
        run: python scripts/v48_es_paid_gate.py

      - name: Submit or observe the one deterministic ES Spot job
        run: python scripts/v48_es_batch_submit.py

      - name: Upload Batch result evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v48-es-single-spot-pilot-${{ github.run_id }}
          path: artifacts/v48_es_batch_result.json
          if-no-files-found: warn
          retention-days: 30
