name: Raio-X V43.5 Visual Smoke

on:
  push:
    branches: [ v43-5-visual-smoke ]

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORTAL: https://raio-x-territorial-app.onrender.com
      CAR: MG-3120904-DFB380BECD7A4323AD8AA68FA14D011F
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect production mobile and desktop
        run: |
          mkdir -p evidence
          cat > /tmp/v43_visual.py <<'PY'
          import asyncio, json, os
          from pathlib import Path
          from playwright.async_api import async_playwright

          PORTAL=os.environ['PORTAL']; CAR=os.environ['CAR']

          async def probe(browser, name, width, height):
              context=await browser.new_context(viewport={'width':width,'height':height})
              page=await context.new_page(); errors=[]; bad=[]
              page.on('pageerror', lambda exc: errors.append(str(exc)[:300]))
              page.on('response', lambda r: bad.append({'status':r.status,'url':r.url}) if r.status>=500 or r.status==422 else None)
              await page.goto(PORTAL, wait_until='domcontentloaded', timeout=60000)
              await page.wait_for_selector('#map', state='visible', timeout=30000)
              await page.wait_for_function("typeof map!=='undefined' && !!map && typeof L!=='undefined'", timeout=30000)
              center=await page.evaluate("""async car=>{
                const r=await fetch('/v1/live/snapshot/'+encodeURIComponent(car));
                const d=await r.json(); if(!r.ok||!d.geometry) throw new Error('snapshot geometry unavailable');
                const tmp=L.geoJSON(d.geometry),c=tmp.getBounds().getCenter();
                map.setView(c,14,{animate:false}); map.fire('moveend');
                return {lat:c.lat,lng:c.lng};
              }""", CAR)
              try:
                  await page.wait_for_function("document.querySelectorAll('.leaflet-overlay-pane path').length>0", timeout=30000)
              except Exception:
                  pass
              await page.wait_for_timeout(2500)
              initial_paths=await page.locator('.leaflet-overlay-pane path').count()
              samples=await page.evaluate("""async()=>{
                const vals=[]; const count=()=>document.querySelectorAll('.leaflet-overlay-pane path').length;
                vals.push(count()); map.panBy([80,0],{animate:false});
                for(let i=0;i<24;i++){await new Promise(r=>setTimeout(r,100));vals.push(count())}
                map.panBy([-80,0],{animate:false});
                for(let i=0;i<24;i++){await new Promise(r=>setTimeout(r,100));vals.push(count())}
                return vals;
              }""")
              await page.wait_for_timeout(1500)
              def visible_rect_script(sel):
                  return """sel=>{const e=document.querySelector(sel);if(!e)return null;const s=getComputedStyle(e),r=e.getBoundingClientRect();if(s.display==='none'||s.visibility==='hidden'||r.width<=0||r.height<=0)return null;return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}}"""
              selectors=['#rxLocateBtn','#rxFilterBtn','#rxMapLegend','#rxFarmNameSource','#rxContextLegend','.rx-rare-mode','.leaflet-control-zoom','.leaflet-control-attribution','#rxNetState']
              rects={s:await page.evaluate(visible_rect_script(s),s) for s in selectors}
              def overlap(a,b):
                  if not a or not b:return False
                  return not (a['right']<=b['x'] or b['right']<=a['x'] or a['bottom']<=b['y'] or b['bottom']<=a['y'])
              essential_overlap=overlap(rects['#rxLocateBtn'],rects['#rxFilterBtn'])
              filter_info=None
              if name=='mobile':
                  secondary=['#rxMapLegend','#rxFarmNameSource','#rxContextLegend','.rx-rare-mode','.leaflet-control-zoom']
                  visible_secondary=[s for s in secondary if rects[s]]
                  assert not visible_secondary, visible_secondary
                  assert rects['#rxLocateBtn'] and rects['#rxFilterBtn'], rects
                  assert not essential_overlap, rects
                  await page.click('#rxFilterBtn'); await page.wait_for_timeout(350)
                  panel=await page.evaluate(visible_rect_script('.rx-filter-panel'),'.rx-filter-panel')
                  filter_info={'panel':panel,'overlap_locate':overlap(panel,rects['#rxLocateBtn']),'overlap_filter':overlap(panel,rects['#rxFilterBtn'])}
                  assert panel and panel['x']>=0 and panel['right']<=width+1 and panel['y']>=0 and panel['bottom']<=height+1, panel
                  assert not filter_info['overlap_locate'] and not filter_info['overlap_filter'], filter_info
                  await page.screenshot(path='evidence/mobile_filter_open.png', full_page=True)
                  await page.click('#rxFilterBtn')
              await page.screenshot(path=f'evidence/{name}.png', full_page=True)
              nonzero=[v for v in samples if v>0]
              result={'name':name,'viewport':[width,height],'center':center,'initial_paths':initial_paths,'sample_min':min(samples) if samples else None,'sample_max':max(samples) if samples else None,'zero_samples':sum(1 for v in samples if v==0),'rects':rects,'essential_overlap':essential_overlap,'filter':filter_info,'page_errors':errors,'bad_responses':bad}
              if initial_paths>0:
                  assert result['zero_samples']==0, result
              assert not errors, errors
              assert not [x for x in bad if x['status']>=500], bad
              await context.close(); return result

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  results=[await probe(browser,'mobile',390,844),await probe(browser,'desktop',1440,900)]
                  await browser.close()
              Path('evidence/visual_result.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
              print('RX_V43_5_VISUAL_SMOKE='+json.dumps(results,ensure_ascii=False))

          asyncio.run(main())
          PY
          python /tmp/v43_visual.py
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raio-x-v43-5-visual-smoke
          path: evidence/
          retention-days: 14
