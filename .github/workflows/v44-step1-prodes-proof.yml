name: V44 Step 1 PRODES Proof
on:
  push:
    branches: [ v44-step1-prodes-proof ]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install audit dependencies
        run: python -m pip install --quiet requests shapely pyproj
      - name: Audit exact PRODES intersections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests, xml.etree.ElementTree as ET
          from datetime import datetime,date
          from pathlib import Path
          from shapely.geometry import shape,mapping
          from shapely.ops import unary_union
          from pyproj import Geod

          CAR='MG-3120904-DFB380BECD7A4323AD8AA68FA14D011F'
          SICAR='https://geoserver.car.gov.br/geoserver/sicar/ows'
          PRODES='https://terrabrasilis.dpi.inpe.br/geoserver/ows'
          GEOD=Geod(ellps='GRS80')
          s=requests.Session(); s.headers.update({'User-Agent':'Raio-X-Territorial/V44-PRODES-proof'})

          def area_ha(g):
              if g is None or g.is_empty:return 0.0
              return abs(GEOD.geometry_area_perimeter(g)[0])/10000.0
          def local(tag):return tag.rsplit('}',1)[-1]
          def score(name,title=''):
              z=(name+' '+title).lower()
              if 'prodes' not in z:return -10000
              sc=100
              for t,p in [('yearly_deforestation',100),('increment',80),('deforestation',50),('desmat',40),('cerrado',30)]:
                  if t in z:sc+=p
              for t,p in [('mosaic',-150),('temporal',-100),('hydro',-100),('rates',-100),('uf_mun',-100),('residue',-80),('residual',-80)]:
                  if t in z:sc+=p
              return sc
          def prop_year(p):
              for k in ('year','ano','year_prodes'):
                  if p.get(k) not in (None,''):
                      m=re.search(r'(19|20)\d{2}',str(p[k]))
                      if m:return int(m.group(0))
              return None
          def image_date(p):
              for k in ('image_date','data_imagem','date'):
                  if p.get(k):
                      z=str(p[k])[:10]
                      for fmt in ('%Y-%m-%d','%d/%m/%Y'):
                          try:return datetime.strptime(z,fmt).date()
                          except Exception:pass
              return None
          def post_cutoff(p):
              d=image_date(p)
              if d:return d>date(2019,7,31)
              y=prop_year(p)
              return bool(y and y>=2020)

          # Exact CAR geometry.
          params={'service':'WFS','version':'1.0.0','request':'GetFeature','typeName':'sicar:sicar_imoveis_mg','outputFormat':'application/json','srsName':'EPSG:4674','CQL_FILTER':f"cod_imovel='{CAR}'",'maxFeatures':'5'}
          r=s.get(SICAR,params=params,timeout=90); r.raise_for_status(); data=r.json(); fs=data.get('features') or []
          assert fs, 'CAR not found'
          carf=fs[0]; car=shape(carf['geometry']); car_geod=area_ha(car)
          car_attr=float((carf.get('properties') or {}).get('area') or 0)
          minx,miny,maxx,maxy=car.bounds

          cap=s.get(PRODES,params={'service':'WFS','version':'2.0.0','request':'GetCapabilities'},timeout=90); cap.raise_for_status(); root=ET.fromstring(cap.text)
          candidates=[]
          for ft in root.iter():
              if local(ft.tag)!='FeatureType':continue
              name=title=None
              for ch in ft:
                  if local(ch.tag)=='Name' and ch.text:name=ch.text.strip()
                  elif local(ch.tag)=='Title' and ch.text:title=ch.text.strip()
              if name and score(name,title or '')>0:candidates.append((score(name,title or ''),name,title))
          candidates=sorted(candidates,reverse=True)[:8]

          evidence=[]; intersections=[]; post_intersections=[]
          for sc,name,title in candidates:
              q={'service':'WFS','version':'2.0.0','request':'GetFeature','typeNames':name,'srsName':'EPSG:4674','bbox':f'{minx},{miny},{maxx},{maxy},EPSG:4674','count':'2000','outputFormat':'application/json'}
              try:
                  rr=s.get(PRODES,params=q,timeout=120); rr.raise_for_status(); jd=rr.json(); layerfs=jd.get('features') or []
              except Exception as exc:
                  evidence.append({'layer':name,'title':title,'score':sc,'error':f'{type(exc).__name__}:{exc}'})
                  continue
              layer_items=[]; layer_inters=[]
              for f in layerfs:
                  try:g=shape(f.get('geometry')); inter=car.intersection(g)
                  except Exception:continue
                  if inter.is_empty:continue
                  a=area_ha(inter)
                  if a<=0:continue
                  p=f.get('properties') or {}; y=prop_year(p); d=image_date(p); pc=post_cutoff(p)
                  layer_inters.append(inter); intersections.append(inter)
                  if pc:post_intersections.append(inter)
                  layer_items.append({'id':f.get('id'),'year':y,'image_date':d.isoformat() if d else None,'post_cutoff':pc,'intersection_ha':round(a,6),'pct_car_attr':round(a/car_attr*100,4) if car_attr else None,'properties':{k:p.get(k) for k in ('year','ano','year_prodes','image_date','data_imagem','class_name','classname','state','uf') if k in p}})
              lu=unary_union(layer_inters) if layer_inters else None
              evidence.append({'layer':name,'title':title,'score':sc,'bbox_features':len(layerfs),'exact_occurrences':len(layer_items),'union_intersection_ha':round(area_ha(lu),6) if lu else 0.0,'items':layer_items})

          hist_union=unary_union(intersections) if intersections else None
          post_union=unary_union(post_intersections) if post_intersections else None
          hist_ha=area_ha(hist_union) if hist_union else 0.0
          post_ha=area_ha(post_union) if post_union else 0.0
          result={'car':CAR,'car_area_attribute_ha':car_attr,'car_area_geodesic_ha':round(car_geod,6),'historical_union_ha':round(hist_ha,6),'historical_pct_car':round(hist_ha/car_attr*100,4) if car_attr else None,'post_2019_07_31_union_ha':round(post_ha,6),'post_2019_07_31_pct_car':round(post_ha/car_attr*100,4) if car_attr else None,'candidate_layers':[{'score':x[0],'name':x[1],'title':x[2]} for x in candidates],'evidence':evidence}
          Path('prodes_step1_proof.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          print('PRODES_STEP1_PROOF='+json.dumps(result,ensure_ascii=False,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prodes-step1-proof
          path: prodes_step1_proof.json
