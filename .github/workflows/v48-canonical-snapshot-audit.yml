name: V48 Canonical SICAR Snapshot Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count-canonical-cars:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove pinned immutable canonical manifest before paid query
        run: python scripts/v48_canonical_snapshot_static_gate.py --require-manifest

      - name: Reject missing Google Cloud configuration
        shell: bash
        env:
          GCP_SA_KEY_PRESENT: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo 'GCP_PROJECT_ID ausente'; exit 2; }
          test -n "$GCP_SA_KEY_PRESENT" || { echo 'GCP_SA_KEY ausente'; exit 2; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install BigQuery dependency
        run: pip install --disable-pip-version-check google-cloud-bigquery

      - name: Recalculate 27 canonical distinct CAR counts
        run: python scripts/v48_canonical_car_counts.py

      - name: Verify 2 GiB hard guard and 27-UF evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/v48_canonical_car_counts.json').read_text(encoding='utf-8'))
          assert data['maximum_bytes_billed'] == 2 * 1024**3, data
          assert data['dry_run_bytes'] <= data['maximum_bytes_billed'], data
          assert len(data['ufs']) == 27, data
          assert all(int(v['distinct_car_count']) > 0 for v in data['ufs'].values()), data
          print(f"RX_V48_CAR_COUNTS_VERIFIED_MAX_BYTES_BILLED={data['maximum_bytes_billed']}")
          print(f"RX_V48_CAR_COUNTS_VERIFIED_DRYRUN_BYTES={data['dry_run_bytes']}")
          print(f"RX_V48_CAR_COUNTS_VERIFIED_REAL_QUERY_BYTES_PROCESSED={data['real_query_bytes_processed']}")
          print(f"RX_V48_CAR_COUNTS_VERIFIED_REAL_QUERY_BYTES_BILLED={data['real_query_bytes_billed']}")
          print('RX_V48_CAR_COUNTS_VERIFIED_UFS=27/27')
          PY

      - name: Print 27 canonical CAR counts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/v48_canonical_car_counts.json').read_text(encoding='utf-8'))
          for uf in sorted(data['ufs']):
              item = data['ufs'][uf]
              print(f"RX_V48_CAR_COUNT_{uf}=snapshot:{item['snapshot']} distinct:{item['distinct_car_count']} rows:{item['row_count']} duplicates:{item['duplicate_rows']}")
          print(f"RX_V48_CAR_COUNTS_NATIONAL_DISTINCT={data['national_distinct_car_count_sum']}")
          print(f"RX_V48_CAR_COUNTS_FINGERPRINT={data['content_fingerprint_sha256']}")
          PY

      - name: Upload canonical CAR count evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-sicar-canonical-car-counts
          path: artifacts/v48_canonical_car_counts.json
          if-no-files-found: warn
          retention-days: 14
