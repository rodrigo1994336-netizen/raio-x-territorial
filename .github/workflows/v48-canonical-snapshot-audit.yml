name: V48 Canonical SICAR Snapshot Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count-canonical-cars:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove pinned manifest and real imports before BigQuery
        run: python scripts/v48_canonical_snapshot_static_gate.py --require-manifest

      - name: Reject missing Google Cloud configuration
        shell: bash
        env:
          GCP_SA_KEY_PRESENT: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo 'GCP_PROJECT_ID ausente'; exit 2; }
          test -n "$GCP_SA_KEY_PRESENT" || { echo 'GCP_SA_KEY ausente'; exit 2; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install BigQuery dependency
        run: pip install --disable-pip-version-check google-cloud-bigquery

      - name: Probe canonical distinct CAR count dry-run only
        run: python scripts/v48_canonical_car_counts.py --dry-run-only

      - name: Verify dry-run evidence and prove no real query
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/v48_canonical_car_counts_dryrun.json').read_text(encoding='utf-8'))
          assert data['mode'] == 'dry_run_only', data
          assert data['maximum_bytes_billed'] == 2 * 1024**3, data
          assert data['real_data_query_executed'] is False, data
          print(f"RX_V48_CAR_COUNTS_VERIFIED_MAX_BYTES_BILLED={data['maximum_bytes_billed']}")
          print(f"RX_V48_CAR_COUNTS_VERIFIED_DRYRUN_BYTES={data['dry_run_bytes']}")
          print(f"RX_V48_CAR_COUNTS_VERIFIED_WITHIN_GUARD={'YES' if data['dry_run_within_guard'] else 'NO'}")
          print('RX_V48_CAR_COUNTS_VERIFIED_REAL_QUERY_EXECUTED=NO')
          PY

      - name: Upload canonical CAR count dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-sicar-canonical-car-counts-dryrun
          path: artifacts/v48_canonical_car_counts_dryrun.json
          if-no-files-found: warn
          retention-days: 14
