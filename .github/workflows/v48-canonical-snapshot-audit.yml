name: V48 Canonical SICAR Snapshot Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-canonical-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static contract gate before metadata or paid query
        run: python scripts/v48_canonical_snapshot_static_gate.py

      - name: Reject missing Google Cloud configuration
        shell: bash
        env:
          GCP_SA_KEY_PRESENT: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo 'GCP_PROJECT_ID ausente'; exit 2; }
          test -n "$GCP_SA_KEY_PRESENT" || { echo 'GCP_SA_KEY ausente'; exit 2; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install BigQuery dependency
        run: pip install --disable-pip-version-check google-cloud-bigquery

      - name: Run authorized lightweight canonical UF matrix
        run: python scripts/v48_canonical_snapshot_audit.py

      - name: Verify 2 GiB hard guard and real-query evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/v48_canonical_snapshot_matrix.json').read_text(encoding='utf-8'))
          assert data['mode'] == 'real_lightweight_canonical_matrix', data
          assert data['real_data_query_executed'] is True, data
          assert data['maximum_bytes_billed'] == 2 * 1024**3, data
          assert data['lightweight_dryrun_bytes'] <= data['maximum_bytes_billed'], data
          print(f"RX_V48_VERIFIED_MAX_BYTES_BILLED={data['maximum_bytes_billed']}")
          print(f"RX_V48_VERIFIED_REAL_QUERY_BYTES_PROCESSED={data['real_query_bytes_processed']}")
          print(f"RX_V48_VERIFIED_REAL_QUERY_BYTES_BILLED={data['real_query_bytes_billed']}")
          print('RX_V48_VERIFIED_REAL_QUERY_EXECUTED=YES')
          PY

      - name: Record Curvelo historical benchmark versus canonical MG date
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/v48_canonical_snapshot_matrix.json').read_text(encoding='utf-8'))
          mg = data['ufs']['MG']
          assert mg['status'] == 'canonical', mg
          canonical = mg['snapshot']
          print('RX_V47_CURVELO_REFERENCE_HISTORICAL=PASS snapshot=2026-08-04 area=14.804116 residual=1.815498')
          print(f'RX_V48_MG_CANONICAL_SNAPSHOT={canonical}')
          if canonical == '2026-08-04':
              print('RX_V48_CURVELO_CANONICAL_DATE_UNCHANGED=PASS snapshot=2026-08-04')
          else:
              print(f'RX_V48_CURVELO_CANONICAL_REVALIDATION_REQUIRED=YES old=2026-08-04 new={canonical}')
          PY

      - name: Print 27 canonical dates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/v48_canonical_snapshot_matrix.json').read_text(encoding='utf-8'))
          for uf in sorted(data['ufs']):
              item = data['ufs'][uf]
              if item['status'] == 'canonical':
                  print(f"RX_V48_CANONICAL_{uf}=snapshot:{item['snapshot']} age_days:{item['age_days_at_audit']}")
              else:
                  print(f"RX_V48_CANONICAL_{uf}=UNAVAILABLE")
          print('RX_V48_COVERAGE_COUNTS=' + json.dumps(data['coverage_count_by_date'], sort_keys=True))
          print('RX_V48_ALL_27_DATES=' + (','.join(data['all_27_dates']) if data['all_27_dates'] else 'NONE'))
          print('RX_V48_CANONICAL_DATES_USED=' + (','.join(data['canonical_dates_used']) if data['canonical_dates_used'] else 'NONE'))
          minimum = data.get('minimum_date_cover')
          print('RX_V48_MINIMUM_DATE_COVER=' + (','.join(minimum) if minimum else 'UNAVAILABLE'))
          PY

      - name: Upload canonical matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-sicar-canonical-snapshot-matrix
          path: |
            artifacts/v48_canonical_snapshot_matrix.json
            artifacts/v48_sicar_canonical_snapshot_manifest_candidate.json
          if-no-files-found: warn
          retention-days: 14
