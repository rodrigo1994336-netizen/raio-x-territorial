name: V48 Canonical SICAR Snapshot Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-promoted-canonical-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify promoted immutable canonical manifest and runtime invariants
        run: python scripts/v48_canonical_snapshot_static_gate.py --require-manifest

      - name: Record canceled count stage
        run: |
          echo 'RX_V48_CANONICAL_CAR_COUNT_STAGE=CANCELED_BY_OWNER_2026-09-09'
          echo 'RX_V48_CANONICAL_CAR_COUNT_QUERY_EXECUTED=NO'
