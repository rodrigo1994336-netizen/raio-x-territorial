name: V48 Canonical SICAR Snapshot Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-canonical-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static contract gate before metadata or dry-run
        run: python scripts/v48_canonical_snapshot_static_gate.py

      - name: Reject missing Google Cloud configuration
        shell: bash
        env:
          GCP_SA_KEY_PRESENT: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo 'GCP_PROJECT_ID ausente'; exit 2; }
          test -n "$GCP_SA_KEY_PRESENT" || { echo 'GCP_SA_KEY ausente'; exit 2; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install BigQuery dependency
        run: pip install --disable-pip-version-check google-cloud-bigquery

      - name: Probe partition metadata and dry-run lightweight canonical audit
        run: python scripts/v48_canonical_snapshot_audit.py

      - name: Prove no real data query was executed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/v48_canonical_snapshot_probe.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['mode'] == 'probe_only_no_real_data_query', data
          assert data['real_data_query_executed'] is False, data
          print(f"RX_V48_PROBE_COMMON_PARTITION_DATES={data['common_partition_dates_count']}")
          print(f"RX_V48_PROBE_LIGHTWEIGHT_DRYRUN_BYTES={data['lightweight_dryrun_bytes']}")
          print('RX_V48_PROBE_REAL_QUERY_EXECUTED=NO')
          PY

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-sicar-canonical-snapshot-probe
          path: artifacts/v48_canonical_snapshot_probe.json
          if-no-files-found: warn
          retention-days: 14
