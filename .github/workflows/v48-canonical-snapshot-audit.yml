name: V48 Canonical SICAR Snapshot Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-type-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify promoted immutable canonical manifest and runtime invariants
        run: python scripts/v48_canonical_snapshot_static_gate.py --require-manifest

      - name: Compile and import-check geometry audit before authentication
        run: |
          python -m py_compile scripts/v48_geometry_type_audit.py
          python scripts/v48_geometry_type_audit.py --import-check

      - name: Reject missing Google Cloud configuration
        shell: bash
        env:
          GCP_SA_KEY_PRESENT: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo 'GCP_PROJECT_ID ausente'; exit 2; }
          test "$GCP_PROJECT_ID" = 'metodo-afp-plataforma' || { echo 'Projeto GCP inesperado'; exit 2; }
          test -n "$GCP_SA_KEY_PRESENT" || { echo 'GCP_SA_KEY ausente'; exit 2; }

      - name: Authenticate read-only diagnostic to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install BigQuery client
        run: pip install --disable-pip-version-check google-cloud-bigquery

      - name: Count canonical CARs by post-union geometry type
        run: python scripts/v48_geometry_type_audit.py

      - name: Upload geometry-type audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-canonical-geometry-type-audit-${{ github.run_id }}
          path: artifacts/v48_geometry_type_audit.json
          if-no-files-found: warn
          retention-days: 30
