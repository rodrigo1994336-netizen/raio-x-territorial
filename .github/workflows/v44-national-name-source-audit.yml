name: V44 National Property Name Source Audit
on:
  push:
    branches: [ v44-national-property-names ]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official nationwide CAFIR bulk source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,html
          from urllib.parse import urljoin
          s=requests.Session();s.headers.update({'User-Agent':'Raio-X-Territorial/official-open-data-audit','Accept':'text/html,*/*'})
          root='https://dadosabertos.rfb.gov.br/CAFIR/'
          r=s.get(root,timeout=30,allow_redirects=True)
          print('DIR',r.status_code,r.url,'bytes',len(r.content),'type',r.headers.get('content-type'))
          print('LAST_MODIFIED',r.headers.get('last-modified'))
          print('HEAD',r.text[:2500].replace('\n',' '))
          links=[]
          for href in re.findall(r'href=["\']([^"\']+)["\']',r.text,re.I):
              if href.startswith('?') or href.startswith('../'):continue
              u=urljoin(r.url,html.unescape(href));
              if u not in links:links.append(u)
          print('LINK_COUNT',len(links))
          for u in links[:100]:print('LINK',u)
          files=[u for u in links if 'PARTE' in u.upper() or u.upper().endswith(('.CSV','.ZIP','.TXT')) or 'K3243' in u.upper()]
          print('DATA_FILES',len(files))
          for u in files[:30]:
              try:
                  h=s.head(u,timeout=30,allow_redirects=True)
                  print('FILE',u,'status',h.status_code,'len',h.headers.get('content-length'),'type',h.headers.get('content-type'),'modified',h.headers.get('last-modified'))
              except Exception as e:print('FILE_ERR',u,type(e).__name__,str(e)[:120])
          # Legacy public path sanity check without downloading the bulk file.
          legacy='https://dadosabertos.rfb.gov.br/CAFIR/K3243.K34313DP.D21223.PARTE01'
          try:
              q=s.get(legacy,headers={'Range':'bytes=0-4095'},timeout=30,stream=True)
              chunk=next(q.iter_content(4096),b'')
              print('LEGACY_SAMPLE',q.status_code,'lenhdr',q.headers.get('content-length'),'range',q.headers.get('content-range'),'modified',q.headers.get('last-modified'),'bytes',len(chunk))
              print('LEGACY_TEXT',chunk.decode('latin1','replace')[:1200].replace('\n',' | '))
          except Exception as e:print('LEGACY_ERR',type(e).__name__,str(e)[:180])
          PY
