name: V44 National Property Name Source Audit
on:
  push:
    branches: [ v44-national-property-names ]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover official Dados.gov resources for SNCR and CAFIR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Raio-X-Territorial/official-open-data-audit','Accept':'application/json'})
          base='https://dados.gov.br'
          specs=s.get(base+'/v3/api-docs',timeout=30)
          print('OPENAPI',specs.status_code,specs.headers.get('content-type'),len(specs.content))
          if specs.ok:
              doc=specs.json()
              p=doc.get('paths',{}).get('/dados/api/publico/conjuntos-dados',{}).get('get',{})
              print('LIST_PARAMS',[(x.get('name'),x.get('schema',{}).get('type')) for x in p.get('parameters',[])])
          queries=['Cadastro de Imóveis Rurais - CAFIR','Sistema Nacional de Cadastro Rural - SNCR/Incra','CAFIR','SNCR']
          for q in queries:
              print('\nQUERY',q)
              found=[]
              for params in [
                  {'isPrivado':'false','pagina':1,'nomeConjuntoDados':q},
                  {'pagina':1,'nomeConjuntoDados':q},
                  {'pagina':1,'termo':q},
              ]:
                  try:
                      r=s.get(base+'/dados/api/publico/conjuntos-dados',params=params,timeout=30)
                      print('LIST',r.status_code,r.url,'bytes',len(r.content),'type',r.headers.get('content-type'))
                      if not r.ok: continue
                      data=r.json(); print('ROOT_TYPE',type(data).__name__,'KEYS',list(data)[:30] if isinstance(data,dict) else '')
                      print('BODY_SAMPLE',json.dumps(data,ensure_ascii=False)[:2500])
                      def walk(x):
                          if isinstance(x,dict):
                              if any(k in x for k in ('titulo','nome','title','name')) and any(k in x for k in ('id','identificador','slug')): found.append(x)
                              for v in x.values(): walk(v)
                          elif isinstance(x,list):
                              for v in x: walk(v)
                      walk(data)
                      if found: break
                  except Exception as e: print('ERR',type(e).__name__,str(e)[:200])
              uniq=[]; seen=set()
              for x in found:
                  key=json.dumps(x,sort_keys=True,ensure_ascii=False)
                  if key not in seen: seen.add(key); uniq.append(x)
              print('CANDIDATES',len(uniq))
              for x in uniq[:20]:
                  print('ITEM',json.dumps(x,ensure_ascii=False)[:3000])
                  for ident in [x.get('id'),x.get('identificador'),x.get('slug')]:
                      if not ident: continue
                      try:
                          d=s.get(base+'/dados/api/publico/conjuntos-dados/'+str(ident),timeout=30)
                          print('DETAIL',ident,d.status_code,d.url,'bytes',len(d.content))
                          if d.ok: print('DETAIL_JSON',json.dumps(d.json(),ensure_ascii=False)[:12000])
                      except Exception as e: print('DETAIL_ERR',type(e).__name__,str(e)[:180])
                      break
          PY
