name: Raio-X V43.8.2 Postdeploy Acceptance

on:
  push:
    branches: [ v43-8-2-postdeploy-acceptance ]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORTAL: https://raio-x-territorial-app.onrender.com
      CAR: MG-3120904-E0C91FE86A3646D5AFA40786D6C554A9
    steps:
      - name: Generate named report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl -fsS --max-time 55 -X POST "$PORTAL/v1/mobile/report/prepare/$CAR" | tee evidence/prepare.json
          for i in $(seq 1 90); do
            curl -fsS --max-time 25 "$PORTAL/v1/mobile/report/status/$CAR" > evidence/status.json
            STATE=$(python -c "import json;print(json.load(open('evidence/status.json')).get('state',''))")
            NAME=$(python -c "import json;print(json.load(open('evidence/status.json')).get('property_name') or '')")
            echo "REPORT_STATUS $i $STATE $NAME"
            [ "$STATE" = ready ] && break
            [ "$STATE" = failed ] && { cat evidence/status.json; exit 1; }
            sleep 3
          done
          python - <<'PY'
          import json
          d=json.load(open('evidence/status.json'))
          assert d.get('state')=='ready',d
          assert d.get('property_name')=='Fazenda Barrinha',d
          assert int(d.get('bytes') or 0)>100000,d
          print('REPORT_READY',d.get('elapsed_ms'),d.get('bytes'),d.get('property_name'))
          PY
          curl -fLsS --max-time 120 "$PORTAL/v1/mobile/report/open/$CAR" -o evidence/fazenda_barrinha.pdf
          test $(stat -c%s evidence/fazenda_barrinha.pdf) -gt 100000
          pdftotext -f 1 -l 1 evidence/fazenda_barrinha.pdf evidence/page1.txt
          grep -qi 'Fazenda Barrinha' evidence/page1.txt
          pdftoppm -f 1 -singlefile -png -r 120 evidence/fazenda_barrinha.pdf evidence/report_page1 >/dev/null 2>&1
          echo 'REPORT_PAGE1_OK'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate named dossier desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dossier.py <<'PY'
          import asyncio,json,os,urllib.request
          from playwright.async_api import async_playwright
          P=os.environ['PORTAL'];C=os.environ['CAR']
          def api(path):
              req=urllib.request.Request(P+path,headers={'User-Agent':'RX-V43.8.2-Acceptance'})
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          snap=api('/v1/live/snapshot/'+C)
          identity=api('/v1/live/property-identity/'+C)
          assert identity.get('name')=='Fazenda Barrinha',identity
          prop={'car_code':C,'municipality':snap.get('municipality'),'uf':snap.get('uf'),'area_ha':snap.get('area_ha'),'status':snap.get('car_status'),'condition':snap.get('condition'),'type':snap.get('property_type')}
          async def one(browser,w,h,label,mobile=False):
              ctx=await browser.new_context(viewport={'width':w,'height':h},is_mobile=mobile)
              page=await ctx.new_page();errors=[];bad=[]
              page.on('pageerror',lambda e:errors.append(str(e)[:250]))
              page.on('response',lambda r:bad.append((r.status,r.url)) if r.status>=500 or (r.status==422 and ('/v1/live/sicar/viewport' in r.url or '/v1/live/property-names/viewport' in r.url)) else None)
              await page.goto(P,wait_until='networkidle',timeout=60000)
              await page.wait_for_timeout(1200)
              await page.wait_for_function('window.showProperty && window.map',timeout=30000)
              await page.evaluate('x=>window.showProperty(x.p,x.g)',{'p':prop,'g':snap.get('geometry')})
              await page.wait_for_function("document.querySelector('#rx43Name')?.textContent.includes('Fazenda Barrinha')",timeout=30000)
              before=await page.evaluate('()=>({lat:map.getCenter().lat,lng:map.getCenter().lng,z:map.getZoom()})')
              await page.screenshot(path=f'evidence/{label}_dossier.png',full_page=True)
              await page.click('#back')
              await page.wait_for_function("!document.body.classList.contains('rx43-dossier-open')",timeout=10000)
              after=await page.evaluate('()=>({lat:map.getCenter().lat,lng:map.getCenter().lng,z:map.getZoom()})')
              assert abs(before['lat']-after['lat'])<1e-7 and abs(before['lng']-after['lng'])<1e-7 and before['z']==after['z'],(before,after)
              assert not errors,errors
              assert not bad,bad
              print(label.upper(),{'before':before,'after':after})
              await ctx.close()
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  await one(b,1440,900,'desktop')
                  await one(b,390,844,'mobile',True)
                  await b.close()
          asyncio.run(main())
          PY
          python /tmp/dossier.py | tee evidence/dossier.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raio-x-v43-8-2-postdeploy-acceptance
          path: evidence/
          retention-days: 14
